<!doctype html>
<html lang="ar" dir="rtl" data-accent="accent2" data-h="2" data-f="1" data-num="1" data-loc="2">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قالب فنادق ناسكون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Template 2 · Motion preview. Keeps T2's identity (Readex Pro, olive, copper, square corners, collage, zigzag)
   and adds scroll-driven motion. Every animation is skipped under prefers-reduced-motion, and the page is
   fully readable if the animation library does not load. */
:root{
  --bg:#F4F2EC; --surface:#FFFFFF; --ink:#151A14; --muted:#5F655B; --line:#E1DED4; --olive:#2E3A27; --olive-2:#3B4A33;
  --accent:#C08A4A; --accent-2:#D6A469; --label:#8A5A22; --on-dark:#F4F2EC; --on-dark-2:#B7BCB0;
  --display:"Readex Pro",system-ui,sans-serif; --body:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --gut:max(20px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip;scroll-padding-top:84px;scroll-padding-bottom:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;overflow-x:clip;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.025em;line-height:1.02;text-wrap:balance}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{letter-spacing:0;line-height:1.18}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:100%;max-width:1440px;margin-inline:auto;padding-inline:var(--gut)}
.icon{width:20px;height:20px;flex:none}
.label{font-size:12.5px;font-weight:700;letter-spacing:1.5px;color:var(--label)}
[dir=rtl] .label{letter-spacing:0;font-size:13.5px}
.big{font-size:clamp(40px,10vw,96px)}
[dir=ltr] .flip{transform:scaleX(-1)}
/* Split words (added by script) */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.wi{display:inline-block;will-change:transform}

/* Buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;text-decoration:none;outline:1px solid rgba(244,242,236,.3);outline-offset:-5px;transition:background-color .2s ease,border-color .2s ease,color .2s ease;touch-action:manipulation}
.btn:hover{background:var(--olive);border-color:var(--olive)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--ink);outline-color:rgba(21,26,20,.28)}
.btn-accent:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-line{background:transparent;color:var(--ink);outline-color:rgba(21,26,20,.16)}
.btn-line:hover{background:var(--ink);color:var(--bg)}
.sq{width:46px;height:46px;border:1px solid var(--ink);background:transparent;display:inline-flex;align-items:center;justify-content:center;transition:background-color .2s ease,color .2s ease}
.sq:hover{background:var(--ink);color:var(--bg)}

/* Loader curtain (created by script only) */
.curtain{position:fixed;inset:0;z-index:100;background:var(--olive);color:var(--on-dark);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:clamp(48px,12vw,140px)}
.curtain .dot{color:var(--accent)}

/* Header: centered logo with a utility row */
.demo-bar{display:block;background:var(--olive);color:#E9E6DC;text-align:center;font-size:12px;padding:7px 20px;padding-top:calc(7px + env(safe-area-inset-top,0px))}
.site-head{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .25s ease,background-color .25s ease,top .25s ease}
.site-head.scrolled{border-bottom-color:var(--line);background:rgba(244,242,236,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.util{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;transition:height .25s ease}
.brand{font-family:var(--display);font-weight:700;font-size:22px;text-decoration:none;display:flex;align-items:center;flex:none}
.brand img{height:40px;width:auto}
.dot{color:var(--accent)}
.top nav{display:none}
.top-actions{display:flex;align-items:center;gap:6px}
.top-actions .btn{display:none}
.lang{min-height:44px;min-width:46px;padding:0 12px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:13px}
.lang:hover{border-color:var(--ink)}
.ghost{width:46px;height:46px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center}
/* H2: logo in the middle, utility row on top */
[data-h="2"] .top{display:grid;grid-template-columns:1fr auto 1fr}
[data-h="2"] .brand{grid-column:2;grid-row:1;justify-self:center}
[data-h="2"] .top-actions{display:contents}
[data-h="2"] .top-actions .ghost{grid-column:1;grid-row:1;justify-self:start}
[data-h="2"] .top-actions .lang{grid-column:3;grid-row:1;justify-self:end}
[data-h="2"] .util{border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
[data-h="2"] .util .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:40px}
[data-h="2"] .util a{text-decoration:none;color:var(--ink)}
[data-h="2"] .util a:hover{color:var(--label)}
[data-h="2"] .util .c{display:flex;gap:22px}

/* Hero */
.hero{position:relative;padding-top:12px}
.hero-text{display:grid;gap:12px;position:relative;z-index:3}
.hero h1{font-size:clamp(52px,14vw,150px);white-space:pre-line;letter-spacing:-.045em}
[dir=rtl] .hero h1{letter-spacing:0;line-height:1.12}
.hero-text p{color:#3E443B;max-width:440px;font-size:17px}
.collage{position:relative;margin-top:28px;height:480px}
.collage .main{position:absolute;inset-inline-end:0;top:0;width:86%;height:400px;overflow:hidden}
.collage .main img{width:100%;height:118%;object-fit:cover;margin-top:-9%}
.collage .small{position:absolute;inset-inline-start:16px;bottom:0;width:52%;height:220px;border:6px solid var(--bg);overflow:hidden;z-index:2}
.collage .small img{width:100%;height:100%;object-fit:cover}
.score{position:absolute;inset-inline-start:16px;top:22px;z-index:3;padding:10px 14px;background:var(--ink);color:var(--bg);display:grid;line-height:1.2}
.score b{font-family:var(--display);font-size:26px}
.score span{font-size:11.5px;opacity:.85}
.badge{position:absolute;z-index:4;inset-inline-end:14px;bottom:36px;width:118px;height:118px;border-radius:50%;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 18px 40px -18px rgba(21,26,20,.55)}
.badge svg.ring{position:absolute;inset:0;width:100%;height:100%}
.badge text{font:700 10.5px var(--display);letter-spacing:2.6px;fill:var(--ink);text-transform:uppercase}
.badge .arr{width:30px;height:30px}
.badge:hover{background:var(--accent-2)}

/* Booking strip */
.strip{margin-top:28px;background:var(--ink);color:var(--bg);position:relative;z-index:3}
.mstrip{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;border:0;background:transparent;color:var(--bg);padding-block:14px;text-align:start}
.mstrip>span:first-child{display:grid;line-height:1.35}
.mstrip small{font-size:11.5px;opacity:.72}
.mstrip b{font-size:16px}
.strip form{display:none}

/* Amenities band: static */
.amen{margin-top:56px;background:var(--olive);color:#E9E6DC}
.amen ul{list-style:none;margin:0;padding:22px 0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 26px;font-family:var(--display);font-weight:500;font-size:16px}
.amen li{display:inline-flex;align-items:center;gap:26px}
.amen li+li::before{content:"";width:7px;height:7px;background:var(--accent);transform:rotate(45deg)}
.amen .ttl{display:block;text-align:center;padding-top:22px;font-size:12.5px;color:var(--accent-2);font-weight:700}

/* Rooms */
.rooms{padding-top:56px;position:relative}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
.head-row .t{display:grid;gap:10px}
.arrows{display:flex;gap:8px;flex:none}
.counter{display:none;font-family:var(--display);font-size:15px;color:var(--muted)}
.counter b{color:var(--ink);font-size:22px}
.track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:var(--gut);scroll-padding-inline:var(--gut);counter-reset:r}
.track::-webkit-scrollbar{display:none}
.room{flex:none;width:min(80vw,330px);scroll-snap-align:start;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);counter-increment:r}
.room .ph{position:relative;overflow:hidden;aspect-ratio:6/7}
.room .ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.room:hover .ph img{transform:scale(1.06)}
.room .no{position:absolute;top:0;inset-inline-start:0;background:var(--bg);padding:6px 12px;font-family:var(--display);font-weight:700;font-size:15px}
.room .no::before{content:"0" counter(r)}
.room .card{position:relative;margin:-54px 0 0;margin-inline-end:28px;padding:16px 18px;background:var(--surface);display:grid;gap:4px}
.room h3{font-size:21px}
.room small{font-size:13.5px;color:var(--muted)}
.room .cta{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;margin-top:4px;color:var(--label)}

/* Numbers: hotel at a glance */
.nm1{margin-top:72px;background:var(--olive);color:var(--bg)}
.nm1 .wrap{display:grid;gap:30px;padding-block:52px}
.nm-head{display:grid;gap:6px}
.nm-head .label{color:var(--accent-2)}
.nm-name{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15}
.nm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 16px}
.nm-grid .it{display:grid;gap:18px;align-content:start;padding-top:16px;border-top:1px solid rgba(244,242,236,.22)}
.nm-grid .it:first-child{border-top-color:var(--accent)}
.nm-grid .k{display:flex;align-items:flex-start;gap:8px;min-height:38px;font-size:13.5px;line-height:1.4;color:#D6D9CF}
.nm-grid .ic{flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(244,242,236,.22);color:var(--accent-2)}
.nm-grid b{display:flex;align-items:baseline;gap:4px;font-family:var(--display);font-weight:700;font-size:54px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.nm-grid b small{font-size:.34em;font-weight:500;color:var(--accent-2);letter-spacing:0}
[dir=rtl] .nm-grid b{direction:ltr;justify-content:flex-end}

/* Spaces zigzag */
.inside{padding-top:76px}
.space{position:relative;margin-bottom:46px}
.space .ph{position:relative;overflow:hidden;height:300px}
.space .ph img{width:100%;height:120%;object-fit:cover;margin-top:-10%}
.space .card{position:relative;margin-top:-50px;margin-inline:56px 16px;padding:22px;background:var(--surface);display:grid;gap:8px;z-index:2}
.space:nth-of-type(even) .ph{width:82%;margin-inline-start:auto;height:260px}
.space:nth-of-type(even) .card{margin-inline:16px 56px}
.space .n{font-family:var(--display);font-weight:700;font-size:14px;color:var(--label)}
.space h3{font-size:24px}
.space p{font-size:15px;color:#3E443B}

/* Reviews: stacked sticky cards */
.reviews{padding-top:76px}
.stack{display:grid;gap:18px;padding-bottom:20px}
.stack blockquote{position:sticky;top:96px;margin:0;padding:26px;background:var(--surface);border:1px solid var(--line);display:grid;gap:14px;box-shadow:0 -14px 30px -24px rgba(21,26,20,.35);transform-origin:50% 0}
.stack blockquote:nth-child(2){top:116px}
.stack blockquote:nth-child(3){top:136px}
.stack .stars{color:var(--label);letter-spacing:2px}
.stack p{font-family:var(--display);font-weight:500;font-size:clamp(19px,4.6vw,28px);line-height:1.5}
.stack cite{font-style:normal;font-size:13px;color:var(--muted)}
.cta-band{margin-top:40px;background:var(--ink);color:var(--bg);padding:34px 24px;display:grid;gap:14px;justify-items:start;position:relative;overflow:hidden}
.cta-band h3{font-size:clamp(30px,7vw,56px)}
.cta-band p{color:#B9BDB2}

/* Location: route line */
.lc{display:grid;padding-top:76px;gap:18px}
.lc .addr{display:flex;align-items:flex-start;gap:10px;font-size:16px}
.lc .addr svg{flex:none;color:var(--label);margin-top:2px}
.lc .btn{justify-self:start}
.tnum b{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tnum span{font-size:13.5px;color:var(--muted)}
/* L2: route line */
.route{position:relative;display:grid;gap:0;padding-inline-start:30px;margin-top:6px}
.route::before{content:"";position:absolute;inset-inline-start:9px;top:12px;bottom:12px;width:2px;background:repeating-linear-gradient(to bottom,var(--olive) 0 8px,transparent 8px 14px)}
.route .st{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 0}
.route .st+.st{border-top:1px solid var(--line)}
.route .st::before{content:"";position:absolute;inset-inline-start:-27px;top:21px;width:14px;height:14px;background:var(--bg);border:2px solid var(--olive);transform:rotate(45deg)}
.route .st.home::before{background:var(--accent);border-color:var(--accent);width:18px;height:18px;inset-inline-start:-29px;top:19px}
.route .st .pl{font-weight:700;font-size:16px}
.route .st.home .pl{font-family:var(--display);font-size:20px}
.route .tnum{display:flex;align-items:baseline;gap:6px}
.lc2 .big{margin-bottom:6px}
.lc2 .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lc2 .meta>div{background:var(--surface);border:1px solid var(--line);padding:16px;display:grid;gap:4px}
.lc2 .meta small{font-size:12.5px;color:var(--muted)}
.lc2 .meta b{font-family:var(--display);font-size:22px}
/* FAQ */
.faq{padding-top:76px}
.faq details{border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{min-height:58px;padding:16px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--display);font-size:22px;line-height:1;transition:transform .25s ease}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding-bottom:16px;color:#3E443B;font-size:15px}

/* Footer: big name + columns */
footer{margin-top:80px;background:var(--ink);color:var(--bg);padding-block:48px calc(104px + env(safe-area-inset-bottom,0px));overflow:hidden}
footer a{text-decoration:none}
.f-name{font-family:var(--display);font-weight:700;font-size:clamp(72px,24vw,300px);line-height:.95;letter-spacing:-.05em;white-space:nowrap}
[dir=rtl] .f-name{letter-spacing:0;line-height:1.15}
.f-top{display:grid;gap:34px;margin-top:30px}
.f-brand{display:grid;gap:14px;justify-items:start}
.f-brand p{color:#B9BDB2;max-width:360px}
.f-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 20px}
.f-col{display:grid;gap:12px;align-content:start;min-width:0;font-size:15px}
.f-col.wide{grid-column:1 / -1}
.f-col h3{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--accent);margin:0 0 2px}
[dir=rtl] .f-col h3{letter-spacing:0;font-size:13.5px}
.f-col small{display:block;font-size:12px;color:#9EA49A}
.f-col a:hover{color:var(--accent)}
.f-col .muted{color:#B9BDB2}
.f-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 20px;margin-top:40px;padding-top:18px;border-top:1px solid rgba(244,242,236,.15);font-size:12.5px;color:#9EA49A}
.f-bottom a:hover{color:var(--bg)}
/* Sticky bar (phones) */
.sticky{position:fixed;inset-inline:0;bottom:0;z-index:30;padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.sticky b{font-family:var(--display)}

/* Cursor bubble (desktop, fine pointer only) */
.cursor{position:fixed;left:0;top:0;z-index:60;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:14px;pointer-events:none;transform:scale(0);opacity:0}

/* Sheet & menu */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0;color:var(--ink)}
dialog::backdrop{background:rgba(21,26,20,.6)}
.sheet{position:absolute;inset-inline:0;bottom:0;background:var(--bg);padding:18px var(--gut) calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-width:560px;margin-inline:auto;max-height:92svh;overflow:auto;border-top:3px solid var(--accent)}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-size:26px}
.field{display:grid;gap:4px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.field:focus-within{border-color:var(--ink)}
.field input,.field select{border:0;background:transparent;padding:2px 0;font:700 16px var(--body);color:var(--ink);width:100%;min-height:30px}
.field input:focus,.field select:focus{outline:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;background:var(--surface);border:1px solid var(--line)}
.stepper div{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border:1px solid var(--line);background:transparent;font-size:20px}
.note{font-size:12.5px;color:var(--muted);text-align:center}
#menu .panel{position:absolute;inset:0;background:var(--ink);color:var(--bg);padding:calc(20px + env(safe-area-inset-top,0px)) var(--gut);display:flex;flex-direction:column;gap:6px;overflow:auto}
#menu .panel a{color:var(--bg);text-decoration:none;font-family:var(--display);font-weight:700;font-size:40px}
#menu .sq{align-self:flex-end;color:var(--bg);border-color:rgba(244,242,236,.4)}

/* Laptop and up */
@media (min-width:960px){
  :root{--gut:80px}
  .top{height:84px}
  .site-head.scrolled .top{height:72px}
  .brand{font-size:30px}
  .top nav{display:flex;gap:36px;font-weight:500}
  .top nav a{text-decoration:none;padding-block:6px;border-bottom:1px solid transparent;transition:border-color .2s ease}
  .top nav a:hover{border-bottom-color:currentColor}
  .top [data-action=menu]{display:none}
  .top-actions{gap:12px}
  .top-actions .btn{display:inline-flex;min-height:48px}
  [data-h="2"] .util{display:block}
  [data-h="2"] .top{height:96px}
  [data-h="2"] .site-head.scrolled .top{height:76px}
  [data-h="2"] .brand{font-size:38px}
  [data-h="2"] .top nav{grid-column:1;grid-row:1;gap:28px;font-size:15px}
  [data-h="2"] .top-actions{display:flex;grid-column:3;grid-row:1;justify-self:end}
  .hero{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;min-height:720px;padding-top:24px}
  .hero-text{grid-column:1 / span 6;grid-row:1;align-self:start;padding-top:44px}
  .hero h1{font-size:clamp(92px,9vw,138px)}
  [dir=ltr] .hero h1{font-size:clamp(80px,7.4vw,118px)}
  .hero-text p{font-size:19px}
  .collage{grid-column:6 / span 7;grid-row:1;margin:0;height:700px}
  .collage .main{width:calc(100% + 80px);height:620px;inset-inline-end:-80px}
  .collage .small{width:300px;height:340px;inset-inline-start:-110px;border-width:10px}
  .score{inset-inline-start:auto;inset-inline-end:40px;top:40px;padding:16px 20px}
  .score b{font-size:34px}

  .inside{padding-top:130px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="shared/engine-t3.js"></script>
<script>
(function(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine=window.matchMedia&&matchMedia('(hover: hover) and (pointer: fine)').matches;
  var hasGsap=!!(window.gsap&&window.ScrollTrigger);
  var animate=hasGsap&&!reduce;
  var $=function(s,r){return (r||document).querySelector(s);};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};

  /* Curtain hides the first paint while the hotel data loads (motion only). */
  var curtain=null;
  if(animate){curtain=document.createElement('div');curtain.className='curtain';curtain.setAttribute('aria-hidden','true');document.body.appendChild(curtain);}

  NaskonHotel.boot();
  if(curtain)setTimeout(function(){if(curtain&&curtain.parentNode&&!document.documentElement.classList.contains('ready'))curtain.remove();},4000);
  $$('[data-year]').forEach(function(e){e.textContent=new Date().getFullYear();});
  var head=$('#head');
  function onScroll(){head.classList.toggle('scrolled',window.scrollY>8);}
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();

  function ready(fn){if(document.documentElement.classList.contains('ready'))fn();else setTimeout(function(){ready(fn);},50);}
  ready(function(){
    var rtl=document.documentElement.dir==='rtl', sx=rtl?1:-1;
    $$('[data-space-n]').forEach(function(e,i){e.textContent='0'+(i+1);});
    $$('[data-time]').forEach(function(t){
      var txt=t.textContent.trim(),m=txt.match(/^\[?(\d+(?:\.\d+)?)\]?\s*(.*)$/);
      var car=/سيار|drive|car/i.test(txt),row=t.parentNode;
      if(row){var w=row.querySelector('[data-mode-walk]'),c=row.querySelector('[data-mode-car]');if(w&&c){if(car){w.setAttribute('hidden','');c.removeAttribute('hidden');}}}
      if(!m)return;t.textContent='';var b=document.createElement('b');b.textContent=m[1];b.setAttribute('data-count','');var sp=document.createElement('span');sp.textContent=m[2];t.appendChild(b);t.appendChild(sp);
    });
    var rooms=$$('#rooms .room'); var tot=$('[data-room-total]'); if(tot)tot.textContent='0'+rooms.length;
    var badge=$('.badge'); if(badge)badge.setAttribute('aria-label',$('#bk-title').textContent);

    if(!animate){ if(curtain)curtain.remove(); return; }
    gsap.registerPlugin(ScrollTrigger);

    /* Split headings into words (never letters: Arabic letters must stay joined). */
    function split(el){
      var lines=el.textContent.split('\n');el.textContent='';
      lines.forEach(function(line,li){
        line.split(/\s+/).filter(Boolean).forEach(function(word,wi,arr){
          var w=document.createElement('span');w.className='w';var inner=document.createElement('span');inner.className='wi';inner.textContent=word;w.appendChild(inner);el.appendChild(w);
          if(wi<arr.length-1)el.appendChild(document.createTextNode(' '));
        });
        if(li<lines.length-1)el.appendChild(document.createElement('br'));
      });
      return $$('.wi',el);
    }

    /* 1. Curtain + hero intro */
    var name=($('.brand [data-t=name]')||{}).textContent||'';
    curtain.innerHTML='<span class="cw"></span><span class="dot">.</span>';curtain.querySelector('.cw').textContent=name;
    var heroWords=split($('[data-split=hero]'));
    var tl=gsap.timeline({defaults:{ease:'power3.out'}});
    tl.from(curtain.children,{yPercent:60,opacity:0,duration:.45,stagger:.06})
      .to(curtain,{yPercent:-100,duration:.7,ease:'power4.inOut'},'+=.15')
      .add(function(){curtain.remove();})
      .from('[data-hero-main]',{clipPath:'inset(100% 0% 0% 0%)',duration:1.1,ease:'power4.out'},'-=.35')
      .from('[data-hero-main] img',{scale:1.25,duration:1.4,ease:'power3.out'},'<')
      .from(heroWords,{yPercent:110,duration:.8,stagger:.06},'<+.1')
      .from('[data-hero-fade]',{y:20,opacity:0,duration:.6,stagger:.1},'<+.3')
      .from('[data-hero-small]',{x:-80*sx,rotate:-6*sx,opacity:0,duration:.9},'<')
      .from('[data-hero-pop]',{scale:0,opacity:0,duration:.6,ease:'back.out(1.7)',stagger:.12},'<+.2')
      .from('[data-hero-strip]',{y:40,opacity:0,duration:.6},'<');

    /* 2. Hero on scroll: depth for photos, the badge spins with the page */
    gsap.to('[data-hero-main] img',{yPercent:8,ease:'none',scrollTrigger:{trigger:'#hero',start:'top top',end:'bottom top',scrub:true}});
    gsap.to('[data-hero-small]',{y:-90,ease:'none',scrollTrigger:{trigger:'#hero',start:'top top',end:'bottom top',scrub:true}});
    gsap.to('[data-spin]',{rotate:360*sx*-1,ease:'none',scrollTrigger:{trigger:document.body,start:'top top',end:'bottom bottom',scrub:.6}});

    /* 4. Section titles: words rise in */
    $$('[data-split]').forEach(function(h){
      if(h.getAttribute('data-split')==='hero')return;
      var ws=split(h);
      gsap.from(ws,{yPercent:110,duration:.7,ease:'power3.out',stagger:.06,scrollTrigger:{trigger:h,start:'top 85%'}});
    });

    /* 5. Generic rise + wipes */
    $$('[data-rise]').forEach(function(el){gsap.from(el,{y:50,opacity:0,duration:.7,ease:'power2.out',scrollTrigger:{trigger:el,start:'top 85%'}});});
    $$('[data-wipe]').forEach(function(el){
      gsap.from(el,{clipPath:rtl?'inset(0% 0% 0% 100%)':'inset(0% 100% 0% 0%)',duration:1.1,ease:'power4.inOut',scrollTrigger:{trigger:el,start:'top 80%'}});
    });
    $$('[data-par]').forEach(function(im){gsap.fromTo(im,{yPercent:-6},{yPercent:6,ease:'none',scrollTrigger:{trigger:im.parentNode,start:'top bottom',end:'bottom top',scrub:true}});});

    /* 6. Counters */
    $$('[data-count]').forEach(function(b){
      var raw=b.textContent.trim(),num=parseFloat(raw);if(isNaN(num)||!/^\d+(\.\d+)?$/.test(raw))return;
      var dec=(raw.split('.')[1]||'').length,o={v:0};b.textContent=(0).toFixed(dec);
      gsap.to(o,{v:num,duration:1.6,ease:'power2.out',scrollTrigger:{trigger:b,start:'top 90%'},onUpdate:function(){b.textContent=o.v.toFixed(dec);}});
    });

    /* 7. Review cards stack: the card underneath shrinks a little as the next one slides over */
    var cards=$$('[data-card]');
    cards.forEach(function(c,i){
      if(i===cards.length-1)return;
      gsap.to(c,{scale:.94,ease:'none',scrollTrigger:{trigger:cards[i+1],start:'top 90%',end:'top 40%',scrub:true}});
    });

    /* 8. Footer name slides along */
    gsap.fromTo('[data-fname]',{xPercent:12*sx},{xPercent:-4*sx,ease:'none',scrollTrigger:{trigger:'footer',start:'top bottom',end:'bottom bottom',scrub:true}});

    /* 9. Rooms: desktop pins the section and scrolls the rooms sideways */
    var mm=gsap.matchMedia();
    mm.add('(min-width: 960px)',function(){
      var sec=$('#rooms'),track=$('#rooms [data-track]');if(!sec||!track)return;
      sec.classList.add('pinned');
      var dist=function(){return Math.max(0,track.scrollWidth-window.innerWidth);};
      if(dist()<60){sec.classList.remove('pinned');return;}
      var now=$('[data-room-now]');
      var tw=gsap.to(track,{x:function(){return dist()*sx;},ease:'none',scrollTrigger:{trigger:sec,start:'top 90px',end:function(){return '+='+dist();},pin:true,scrub:.6,invalidateOnRefresh:true,
        onUpdate:function(self){if(now){var i=Math.min(rooms.length,Math.floor(self.progress*rooms.length)+1);now.textContent='0'+i;}}}});
      $$('[data-clip]').forEach(function(ph,i){gsap.from(ph,{clipPath:'inset(0% 0% 100% 0%)',duration:1,ease:'power4.out',delay:i*.08,scrollTrigger:{trigger:sec,start:'top 75%'}});});
      return function(){sec.classList.remove('pinned');gsap.set(track,{clearProps:'x'});};
    });
    mm.add('(max-width: 959px)',function(){
      $$('[data-clip]').forEach(function(ph){gsap.from(ph,{clipPath:'inset(0% 0% 100% 0%)',duration:1,ease:'power4.out',scrollTrigger:{trigger:ph,start:'top 85%'}});});
    });

    /* 10. Pointer extras (desktop only): hero depth, magnetic buttons, cursor bubble */
    if(fine){
      var col=$('.collage');
      if(col){var mx=gsap.quickTo('[data-hero-small]','x',{duration:.8,ease:'power3'}),my=gsap.quickTo('[data-hero-pop]','y',{duration:.8,ease:'power3'});
        col.addEventListener('mousemove',function(e){var r=col.getBoundingClientRect();var px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;mx(px*30);my(py*20);});
        col.addEventListener('mouseleave',function(){mx(0);my(0);});}
      $$('[data-magnet]').forEach(function(b){
        var qx=gsap.quickTo(b,'x',{duration:.4,ease:'power3'}),qy=gsap.quickTo(b,'y',{duration:.4,ease:'power3'});
        b.addEventListener('mousemove',function(e){var r=b.getBoundingClientRect();qx((e.clientX-r.left-r.width/2)*.25);qy((e.clientY-r.top-r.height/2)*.35);});
        b.addEventListener('mouseleave',function(){qx(0);qy(0);});
      });
      var dot=$('[data-cursor-dot]');
      if(dot){var cx=gsap.quickTo(dot,'x',{duration:.35,ease:'power3'}),cy=gsap.quickTo(dot,'y',{duration:.35,ease:'power3'});
        window.addEventListener('mousemove',function(e){cx(e.clientX);cy(e.clientY);},{passive:true});
        $$('[data-cursor]').forEach(function(el){
          el.addEventListener('mouseenter',function(){gsap.to(dot,{scale:1,opacity:1,duration:.3,ease:'back.out(2)'});});
          el.addEventListener('mouseleave',function(){gsap.to(dot,{scale:0,opacity:0,duration:.25});});
        });}
    }
    ScrollTrigger.refresh();
  });
})();
</script>
</body>
</html>
