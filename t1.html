<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فندق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
/* Template 1 · Calm. Mobile first; the layout widens at 960px. */
:root{
  --bg:#F2F1EC; --surface:#FFFFFF; --band:#E7E5DD; --ink:#14211F; --muted:#5A6764; --line:#DAD7CD;
  --accent:#1F4D45; --accent-ink:#FFFFFF; --brass:#8A6A35; --dark:#14211F;
  --display:"Markazi Text","Amiri",Georgia,serif; --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; --latin:"Cormorant Garamond",Georgia,serif;
  --gutter:max(22px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:clip}
img{display:block;max-width:100%}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:100%;padding-inline:max(22px,env(safe-area-inset-left,0px)) max(22px,env(safe-area-inset-right,0px));max-width:1440px;margin-inline:auto}
.eyebrow{font-size:12.5px;letter-spacing:2px;color:var(--brass)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none}
.btn-line{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.icon{width:20px;height:20px;flex:none}

/* Hero */
.hero{position:relative;min-height:min(92svh,820px);display:flex;flex-direction:column;color:#fff;background:#24302D center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,22,20,.55) 0%,rgba(14,22,20,0) 22%,rgba(14,22,20,0) 45%,rgba(14,22,20,.84) 100%)}
.hero>*{position:relative}
html{scroll-padding-top:84px}
.hero>.top{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;color:#fff;transition:color .3s,padding .3s}
.hero>.top::before{content:"";position:absolute;inset-block:0;left:calc(50% - 50vw);right:calc(50% - 50vw);z-index:-1;background:linear-gradient(180deg,rgba(14,22,20,.45),rgba(14,22,20,0));transition:background .3s,box-shadow .3s,backdrop-filter .3s}
html.scrolled .hero>.top{color:var(--ink);padding-block:8px}
html.scrolled .hero>.top::before{background:rgba(242,241,236,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(20,33,31,.35)}
.brand{display:flex;flex-direction:column;gap:3px;line-height:1;color:inherit;text-decoration:none}
.brand b{font-family:var(--display);font-weight:700;font-size:28px;transition:font-size .3s}
.brand i{font-family:var(--latin);font-size:12.5px;opacity:.8;letter-spacing:.6px;font-style:italic}
html.scrolled .brand b{font-size:24px}
.brand img{height:44px;width:auto}
.wm{display:inline-flex;align-items:center;gap:7px;line-height:1}
.wm-t{display:grid;gap:5px;justify-items:center}
.wm b{font-family:var(--latin);font-style:normal;font-weight:500;font-size:30px;letter-spacing:.06em;line-height:.8}
.wm small{font-family:var(--latin);font-size:8.5px;letter-spacing:.34em;margin-inline-end:-.34em;opacity:.75;white-space:nowrap}
.wm .mark{height:42px;width:auto}
html.scrolled .brand .wm b{font-size:26px}
html.scrolled .brand .wm .mark{height:36px}
.m-brand .wm b{font-size:26px}.m-brand .wm .mark{height:36px}
.f-brand .wm{color:#fff;margin-bottom:6px}.f-brand .wm b{font-size:52px}.f-brand .wm small{font-size:13px}.f-brand .wm .mark{height:72px}
.top nav{display:none}
.top-actions{display:flex;align-items:center;gap:8px}
.top-actions .ghost{height:42px;min-width:42px;border:1px solid currentColor;border-color:color-mix(in srgb,currentColor 35%,transparent);border-radius:999px;padding:0 14px;font-size:13.5px;font-weight:600}
.top-actions [data-action=menu]{width:42px;padding:0}
.ghost{height:44px;min-width:44px;padding:0 8px;border:0;background:transparent;color:inherit;display:inline-flex;align-items:center;justify-content:center}
.demo-pill{order:-1;align-self:stretch;text-align:center;padding:6px 16px calc(6px);padding-top:calc(6px + env(safe-area-inset-top,0px));background:rgba(10,16,15,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:11.5px;letter-spacing:.5px;color:#E9DDC4}
.demo-pill+.top,.demo-pill~.top{padding-top:14px}
.hero-body{margin-top:auto;padding-bottom:34px;display:flex;flex-direction:column;gap:14px;max-width:720px}
.hero .eyebrow{color:#E9DDC4;display:flex;align-items:center;gap:10px}
.hero .eyebrow::before{content:"";width:26px;height:1px;background:currentColor}
.hero h1{font-size:clamp(48px,13vw,104px);line-height:1;white-space:pre-line}
.hero p{margin:0;color:rgba(255,255,255,.88);max-width:420px}
.date-pill{margin-top:8px;height:60px;padding:0 8px 0 18px;border-radius:999px;background:rgba(255,255,255,.96);color:var(--ink);display:flex;align-items:center;justify-content:space-between;text-decoration:none;border:0;width:100%;max-width:420px;text-align:start}
.date-pill span{display:flex;flex-direction:column;line-height:1.3}
.date-pill small{font-size:11.5px;color:var(--muted)}
.date-pill .go{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff}
[dir=ltr] .date-pill .go svg{transform:scaleX(-1)}

/* Desktop booking bar */
.bar{display:none}

/* Sections */
section{scroll-margin-top:24px}
.intro{padding-top:68px;display:grid;gap:30px}
.intro .lead{display:grid;gap:14px}
.intro h2{font-size:clamp(36px,9vw,64px);line-height:1.1}
.intro h2 span:last-child{color:var(--brass)}
.intro p{margin:0;font-size:17px;line-height:1.95;color:#3C4846;max-width:58ch}
.perks{margin-top:72px;padding-block:60px 64px;background:var(--accent);color:#fff;position:relative;overflow:hidden}
.perks::before{content:"";position:absolute;inset:auto auto -45% -35%;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--brass) 30%,transparent),transparent);pointer-events:none}
.perks .wrap{position:relative}
.perks .kicker{color:#D9B98A}
.perks h2{font-size:clamp(32px,8vw,52px);line-height:1.1;margin:12px 0 26px;color:#fff}
.perk-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style:none}
.perk-list li{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px 16px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(255,255,255,.04)}
.perk-list .ico{width:46px;height:46px;border-radius:50%;border:1px solid color-mix(in srgb,#D9B98A 55%,transparent);color:#D9B98A;display:grid;place-items:center;margin-bottom:6px}
.perk-list .ico svg{width:22px;height:22px}
.perk-list b{font-size:16px;font-weight:600;line-height:1.35}
.perk-list span:not(.ico){font-size:13px;line-height:1.6;color:rgba(255,255,255,.68)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px 22px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;box-shadow:0 14px 30px -26px rgba(20,33,31,.4)}
.fact .ico{width:30px;height:30px;color:var(--brass)}
.fact .ico:empty{display:none}
.fact .ico svg{width:100%;height:100%}
.fact b{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;color:var(--ink)}
.fact .lbl{font-size:14px;line-height:1.5;color:var(--muted)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.sec-head h2{font-size:clamp(38px,9vw,72px);line-height:1}
.rooms{padding-top:80px}
.sec-head p{margin:10px 0 0;color:var(--muted);font-size:15px;max-width:40ch}
.sec-head .count{font-family:var(--latin);font-style:italic;color:var(--brass);font-size:20px}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:max(22px,env(safe-area-inset-left,0px));scroll-padding-inline:22px}
.track::-webkit-scrollbar{display:none}
.room{flex:none;width:min(78vw,330px);scroll-snap-align:start;display:flex;flex-direction:column;gap:14px;color:var(--ink);text-decoration:none}
.room img{width:100%;aspect-ratio:5/6;object-fit:cover;border-radius:20px}
.room .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.room h3{font-size:27px}
.room small{font-size:13px;color:var(--muted)}
.room .foot{padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:14px}
.room .foot b{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.room .foot b::after{content:"←"}
[dir=ltr] .room .foot b::after{content:"→"}
.room img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.room .ph{overflow:hidden;border-radius:20px;display:block}
.room:hover img{transform:scale(1.04)}
.arrows{display:none;gap:8px}
.arrows button{width:48px;height:48px;border-radius:50%;border:1px solid var(--ink);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink)}
[dir=ltr] .arrows svg{transform:scaleX(-1)}
.inside{padding-top:80px}
.tiles{display:grid;gap:12px}
.tile{position:relative;min-height:300px;border-radius:22px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;background:#2a3330 center/cover no-repeat}
.tile:first-child{min-height:420px}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,22,20,0) 45%,rgba(14,22,20,.8) 100%)}
.tile>*{position:relative}
.tile h3{font-size:32px}
.tile p{margin:4px 0 0;font-size:14.5px;color:rgba(255,255,255,.9)}
.reviews{margin-top:80px;padding-block:64px 56px;background:var(--band);overflow:hidden}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:2px;color:var(--brass)}
:lang(ar) .kicker,:lang(ar) .eyebrow,:lang(ar) .f-col h3{letter-spacing:0;font-size:13.5px;font-weight:600}
.kicker::before{content:"";width:28px;height:1px;background:currentColor}
.rv-head{display:grid;gap:24px;margin-bottom:28px}
.rv-head h2{font-size:clamp(40px,10vw,76px);line-height:1;margin-top:10px}
.score{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--surface);border-radius:18px;border:1px solid #DDD9CE;justify-self:start}
.score>b{font-family:var(--latin);font-style:italic;font-weight:500;font-size:54px;line-height:.9;color:var(--accent)}
.score div{display:grid;gap:2px;font-size:13px;color:var(--muted)}
.score .stars{color:var(--brass);letter-spacing:3px;font-size:15px}
.rv-track{display:grid;grid-auto-flow:column;grid-auto-columns:min(84%,420px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px var(--gutter) 10px;scroll-padding-inline:var(--gutter);scrollbar-width:none}
.rv-track::-webkit-scrollbar{display:none}
.rv-card{scroll-snap-align:start;margin:0;background:var(--surface);border-radius:22px;padding:26px 22px 20px;display:flex;flex-direction:column;gap:18px;box-shadow:0 1px 0 #DDD9CE,0 18px 40px -28px rgba(20,33,31,.35)}
.rv-card .qm{font-family:var(--display);font-size:72px;line-height:.4;height:26px;color:var(--brass)}
.rv-card blockquote{margin:0;font-family:var(--display);font-weight:500;font-size:23px;line-height:1.5;flex:1}
.rv-card figcaption{display:flex;align-items:center;gap:12px;padding-top:16px;border-top:1px solid var(--line);font-size:13px}
.rv-card .av{width:38px;height:38px;border-radius:50%;background:var(--band);color:var(--accent);display:grid;place-items:center;font-family:var(--latin);font-style:italic;font-size:18px;flex:none}
.rv-card figcaption span:last-child{display:grid;gap:1px}
.rv-card small{color:var(--muted);font-size:12px}
.rv-all{display:inline-flex;align-items:center;gap:8px;margin-top:22px;color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:3px}
.location{padding-top:72px;display:grid;gap:18px}
.map{height:260px;border-radius:20px;background:#E3E5DE;background-image:linear-gradient(#D5D9D0 1px,transparent 1px),linear-gradient(90deg,#D5D9D0 1px,transparent 1px);background-size:26px 26px;position:relative;overflow:hidden;display:block}
.map.live::after{display:none}
.map iframe{width:100%;height:100%;border:0;filter:grayscale(.35) contrast(1.05)}
.dir-btn{justify-self:start;height:48px;border-radius:999px;padding:0 22px;font-size:14.5px}
.map::after{content:"";position:absolute;inset-inline-start:50%;top:50%;width:42px;height:42px;margin:-21px;border-radius:50%;background:var(--accent);border:5px solid #F7F6F2}
.dist div{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.dist span:last-child{color:var(--muted)}
.faq{padding-top:72px}
.faq details{padding:18px 0;border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font-size:20px;line-height:1;color:var(--muted)}
.faq details[open] summary::after{content:"−"}
.faq p{margin:10px 0 0;color:#3C4846;font-size:15px}
footer{margin-top:80px;padding-block:0 calc(100px + env(safe-area-inset-bottom,0px));background:var(--dark);color:#E6ECE9;position:relative;overflow:hidden}
footer::before{content:"";position:absolute;inset:-40% -30% auto auto;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 55%,transparent),transparent);opacity:.55;pointer-events:none}
footer>.wrap{position:relative}
footer a{color:inherit;text-decoration:none}
.f-cta{padding-block:64px 44px;border-bottom:1px solid rgba(230,236,233,.14);display:grid;gap:26px}
.f-cta h2{font-size:clamp(42px,11vw,88px);line-height:1.02;white-space:pre-line;color:#fff}
.f-cta .acts{display:flex;flex-wrap:wrap;gap:10px}
.btn.light{background:#fff;color:var(--ink)}
.btn.line{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.f-grid{display:grid;gap:30px;padding-block:40px 34px}
.f-brand b{display:block;font-family:var(--display);font-weight:600;font-size:44px;line-height:1;color:#fff}
.f-brand i{font-family:var(--latin);font-size:19px;color:#B9C6C1}
.f-brand p{margin:14px 0 0;font-size:14px;line-height:1.7;color:#9FB0AA;max-width:34ch}
.f-col{display:grid;gap:10px;align-content:start;font-size:15px}
.f-col h3{font-family:var(--body);font-size:11.5px;letter-spacing:2px;font-weight:600;color:var(--brass-l,#C9A86A);margin-bottom:4px}
.f-col a:hover{color:#fff;text-decoration:underline;text-underline-offset:4px}
.f-col .muted{color:#9FB0AA}
.f-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 20px;padding-block:20px;border-top:1px solid rgba(230,236,233,.14);font-size:12.5px;color:#9FB0AA}
.f-bottom .ghost{height:36px;padding:0 14px;border:1px solid rgba(230,236,233,.25);border-radius:999px;font-size:13px}
.credit{color:#9FB0AA}
.credit b{color:#fff;font-weight:600}

/* Sticky booking bar (phones) */
.sticky{position:fixed;inset-inline:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(20,33,31,.08);display:flex;align-items:center;justify-content:space-between;gap:12px}
.sticky .lbl{display:flex;flex-direction:column;line-height:1.3;font-size:14px}
.sticky small{font-size:11.5px;color:var(--muted)}

/* Booking sheet */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:rgba(20,33,31,.5)}
.sheet{position:absolute;inset-inline:0;bottom:0;background:var(--bg);border-radius:26px 26px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-width:560px;margin-inline:auto;max-height:92svh;overflow:auto}
.grab{width:44px;height:5px;border-radius:3px;background:#CFCBC0;justify-self:center}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-size:28px}
.close{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--muted)}
.field input,.field select{border:0;background:transparent;padding:2px 0;font:600 16px var(--body);color:var(--ink);width:100%;min-height:28px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.stepper div{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid #D9D5CA;background:transparent;font-size:20px;color:var(--ink)}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}

/* Menu */
#menu .panel{position:absolute;inset:0;background:var(--dark);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) var(--gutter) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:auto}
#menu .panel::before{content:"";position:absolute;inset:auto -40% -30% auto;width:480px;height:480px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 60%,transparent),transparent);opacity:.6;pointer-events:none}
#menu .panel>*{position:relative}
.m-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.12)}
.m-brand b{display:block;font-family:var(--display);font-weight:600;font-size:26px;line-height:1}
.m-brand i{font-family:var(--latin);font-size:14px;color:#B9C6C1}
#menu .close{background:transparent;color:#fff;border-color:rgba(255,255,255,.3);flex:none}
.m-links{counter-reset:m;display:grid;margin-block:14px auto}
.m-links a{counter-increment:m;display:flex;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.08);color:#fff;text-decoration:none;font-family:var(--display);font-size:34px;line-height:1.1}
.m-links a::before{content:counter(m,decimal-leading-zero);font-family:var(--latin);font-style:italic;font-size:16px;color:#C9A86A;min-width:24px}
.m-links a::after{content:"←";margin-inline-start:auto;font-family:var(--body);font-size:18px;color:rgba(255,255,255,.45)}
[dir="ltr"] .m-links a::after{content:"→"}
.m-foot{display:grid;gap:14px;padding-top:22px}
.m-foot .btn{width:100%;height:56px;font-size:16px}
.m-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.m-row a{color:#fff;text-decoration:none;display:grid;gap:2px}
.m-row a small{color:#9FB0AA;font-size:11.5px}
.m-row .ghost{height:40px;padding:0 16px;border:1px solid rgba(255,255,255,.3);border-radius:999px;color:#fff}
.m-addr{font-size:12.5px;color:#9FB0AA}
#menu[open] .m-links a{animation:m-in .5s cubic-bezier(.2,.7,.2,1) both}
#menu[open] .m-links a:nth-child(2){animation-delay:.04s}#menu[open] .m-links a:nth-child(3){animation-delay:.08s}#menu[open] .m-links a:nth-child(4){animation-delay:.12s}#menu[open] .m-links a:nth-child(5){animation-delay:.16s}
@keyframes m-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#menu[open] .m-links a{animation:none}}

/* Reveal */
.js-reveal .reveal{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.js-reveal .reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js-reveal .reveal{opacity:1;transform:none;transition:none}}

/* Laptop and up */
@media (min-width:960px){
  body{padding-bottom:0}
  .wrap{padding-inline:80px}
  html{scroll-padding-top:96px}
  .hero>.top{padding-block:18px}
  html.scrolled .hero>.top{padding-block:12px}
  .top nav{display:flex;gap:36px;font-size:15.5px;position:absolute;left:50%;transform:translateX(-50%)}
  .top nav a{color:inherit;text-decoration:none;opacity:.9;position:relative;padding-block:6px}
  .top nav a::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1.5px;background:currentColor;transform:scaleX(0);transition:transform .3s}
  .top nav a:hover::after{transform:scaleX(1)}
  .top [data-action=menu]{display:none}
  .top-actions .btn{background:#fff;color:var(--ink);border-radius:999px;height:46px;padding:0 24px}
  html.scrolled .top-actions .btn{background:var(--accent);color:var(--accent-ink)}
  .hero{min-height:860px}
  .hero-body{padding-bottom:150px;max-width:1440px}
  .hero h1{max-width:900px}
  .hero p{font-size:19px}
  .date-pill{display:none}
  .bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.2fr) 260px;position:relative;z-index:2;margin:-58px 80px 0;background:var(--surface);border-radius:22px;box-shadow:0 24px 60px rgba(20,33,31,.18);overflow:hidden;max-width:1280px}
  .bar label{display:flex;flex-direction:column;gap:6px;padding:22px 26px;border-inline-end:1px solid #ECE9E1;font-size:13px;color:var(--muted)}
  .bar input,.bar select{border:0;background:transparent;padding:0;font:600 17px var(--body);color:var(--ink);width:100%}
  .bar .g{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .bar .g button{width:34px;height:34px;border-radius:50%;border:1px solid #D9D5CA;background:transparent;color:var(--ink)}
  .bar .btn{height:auto;border-radius:0;font-size:17px}
  .perks{margin-top:130px;padding-block:110px}
  .perks .wrap{display:grid;grid-template-columns:4fr 8fr;grid-template-rows:auto 1fr;column-gap:80px;align-items:start}
  .perks h2{margin-top:16px}
  .perks .kicker,.perks h2{grid-column:1}
  .perks h2{margin-bottom:0}
  .perk-list{grid-column:2;grid-row:1 / span 2;gap:18px}
  .perk-list li{padding:28px 26px}
  .perk-list b{font-size:19px}
  .perk-list span:not(.ico){font-size:14.5px}
  .intro{padding-top:150px;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:center}
  .intro .lead{grid-column:span 7;gap:20px}
  .intro p{font-size:18px}
  .facts{grid-column:8 / span 5;gap:16px}
  .fact{padding:26px 24px 28px}
  .fact b{font-size:36px}
  .fact .lbl{font-size:15px}
  .rooms,.inside,.location,.faq{padding-top:140px}
  .track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;overflow:visible;padding-inline:80px;max-width:1440px;margin-inline:auto}
  .room{width:auto}
  .room img{aspect-ratio:4/5;border-radius:22px}
  .room h3{font-size:32px}
  .tiles{grid-template-columns:7fr 5fr;gap:24px}
  .tile,.tile:first-child{min-height:560px;padding:36px}
  .tile h3{font-size:44px}
  .tile p{font-size:17px}
  .reviews{margin-top:140px;padding-block:110px}
  .rv-head{grid-template-columns:1fr auto;align-items:end;margin-bottom:44px}
  .score{padding:20px 26px}
  .score>b{font-size:72px}
  .rv-track{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1440px;margin-inline:auto;padding-inline:80px;overflow:visible}
  .rv-card{padding:34px 30px 24px}
  .rv-card blockquote{font-size:26px}
  .rv-all{margin-top:34px}
  .location{grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:start}
  .location .info{grid-column:span 5;display:grid;gap:18px}
  .location .map{grid-column:7 / span 6;height:460px;grid-row:1 / span 2}
  .faq-grid{display:grid;grid-template-columns:5fr 6fr;column-gap:8%}
  footer{margin-top:140px;padding-block:0}
  footer::before{width:900px;height:900px}
  .f-cta{grid-template-columns:1fr auto;align-items:end;padding-block:110px 72px}
  .f-grid{grid-template-columns:5fr 3fr 3fr 3fr;gap:48px;padding-block:64px 56px}
  .f-brand b{font-size:60px}
  .sticky{display:none}
}
</style>
</head>
<body>

<header class="hero" data-bg="photos.hero" id="top">
  <div class="wrap top">
    <a class="brand" href="#top">
      <img data-src="logo" data-alt="name" alt="">
      <span class="wm" data-if="brandWord,!logo" dir="ltr"><span class="wm-t"><b data-t="brandWord"></b><small data-t="brandSub"></small></span><img class="mark" data-src="logoMark" alt=""></span>
      <b data-if="!logo,!brandWord" data-t="name"></b>
      <i data-if="!logo,!brandWord" data-t="nameLatin" dir="ltr"></i>
    </a>
    <nav aria-label="الأقسام">
      <a href="#rooms" data-ui="rooms"></a>
      <a href="#inside" data-ui="inside" data-if="spaces"></a>
      <a href="#reviews" data-ui="reviews" data-if="reviews"></a>
      <a href="#location" data-ui="location"></a>
    </nav>
    <div class="top-actions">
      <button class="ghost" type="button" data-action="lang" data-ui="lang_switch"></button>
      <button class="ghost" type="button" data-action="menu" data-aria="menu"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M8 16h12"/></svg></button>
      <a class="btn" href="#bar" data-open-booking data-ui="book_now" hidden></a>
    </div>
  </div>
  <span class="demo-pill" data-if="demo" data-ui="demo"></span>
  <div class="wrap hero-body">
    <span class="eyebrow" data-t="eyebrow"></span>
    <h1 data-show="hero" data-default="hero_t1"></h1>
    <p data-t="heroLine"></p>
    <button class="date-pill" type="button" data-open-booking>
      <span><small data-ui="checkin"></small><b data-ui="check_avail"></b></span>
      <span class="go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></span>
    </button>
  </div>
</header>

<form class="bar" id="bar" data-booking>
  <label><span data-ui="checkin"></span><input type="date" name="in" required></label>
  <label><span data-ui="checkout"></span><input type="date" name="out" required></label>
  <label><span data-ui="guests"></span><span class="g"><button type="button" data-step="-1" aria-label="−">−</button><b data-guest-count></b><button type="button" data-step="1" aria-label="+">+</button></span></label>
  <label><span data-ui="room"></span><select name="room"></select></label>
  <button class="btn" type="submit" data-ui="book_wa"></button>
</form>

<main>
  <section class="wrap intro reveal" data-if="intro">
    <div class="lead">
      <span class="kicker" data-ui="about"></span>
      <h2><span data-ui="welcome_to"></span> <span data-t="name"></span></h2>
      <p data-t="intro"></p>
    </div>
    <div class="facts">
      <template data-each="facts"><div class="fact"><span class="ico" data-icon-of></span><b data-t="item.value" dir="auto"></b><span class="lbl" data-t="item.label"></span></div></template>
      <div class="fact" data-if="rating,!facts"><span class="ico"></span><b data-show="rating"></b><span class="lbl" data-ui="rating_google"></span></div>
      <div class="fact" data-if="roomsTotal,!facts"><span class="ico"></span><b data-show="rooms_total"></b><span class="lbl" data-ui="rooms_label"></span></div>
      <div class="fact" data-if="!facts"><span class="ico"></span><b>24/7</b><span class="lbl" data-ui="reception_always"></span></div>
    </div>
  </section>

  <section class="perks" data-if="amenities">
    <div class="wrap reveal">
      <span class="kicker" data-ui="services"></span>
      <h2 data-ui="perks"></h2>
      <ul class="perk-list"><template data-each="amenities"><li><span class="ico" data-icon-of></span><b data-t="item.t"></b><span data-t="item.d"></span></li></template></ul>
    </div>
  </section>

  <section class="rooms" id="rooms" data-carousel data-if="rooms">
    <div class="wrap sec-head reveal">
      <div><h2 data-ui="rooms"></h2><p data-if="roomsLine" data-t="roomsLine"></p></div>
      <div class="arrows"><button type="button" data-dir="prev" data-aria="prev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button><button type="button" data-dir="next" data-aria="next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button></div>
    </div>
    <div class="track" data-track>
      <template data-each="rooms">
        <a class="room reveal" href="#bar" data-pick-room>
          <span class="ph"><img data-src="item.photo" data-alt="item.name" alt="" loading="lazy"></span>
          <span class="row"><h3 data-t="item.name"></h3><small data-guests></small></span>
          <small data-t="item.desc"></small>
          <span class="foot"><span data-price></span><b data-ui="book_room"></b></span>
        </a>
      </template>
    </div>
  </section>

  <section class="wrap inside" id="inside" data-if="spaces">
    <div class="sec-head reveal"><div style="display:grid;gap:10px"><span class="eyebrow" data-ui="inside"></span><h2 data-ui="inside_title"></h2></div></div>
    <div class="tiles">
      <template data-each="spaces" data-limit="2">
        <article class="tile reveal" data-bg="item.photo">
          <h3 data-t="item.name"></h3>
          <p data-t="item.text"></p>
        </article>
      </template>
    </div>
  </section>

  <section class="reviews" id="reviews" data-if="reviews">
    <div class="wrap rv-head reveal">
      <div><span class="kicker" data-ui="reviews"></span><h2 data-ui="guests_said"></h2></div>
      <div class="score" data-if="rating"><b data-show="rating" dir="ltr"></b><div><span class="stars" data-show="stars"></span><span data-show="reviews_n"></span><span data-ui="on_google"></span></div></div>
    </div>
    <div class="rv-track reveal">
      <template data-each="reviews" data-limit="3">
        <figure class="rv-card"><span class="qm" aria-hidden="true">“</span><blockquote data-t="item.text"></blockquote><figcaption><span class="av" aria-hidden="true">G</span><span><b data-t="item.author"></b><small data-t="item.note"></small></span></figcaption></figure>
      </template>
    </div>
    <div class="wrap"><a class="rv-all" data-link="reviews"><span data-ui="all_reviews"></span><span aria-hidden="true">↗</span></a></div>
  </section>

  <section class="wrap location" id="location">
    <div class="info reveal">
      <span class="kicker" data-ui="location"></span>
      <h2 class="sec-h" data-ui="near" style="font-size:clamp(38px,9vw,72px);line-height:1"></h2>
      <div class="dist">
        <template data-each="distances"><div><span data-t="item.place"></span><span data-t="item.time"></span></div></template>
      </div>
      <span data-t="address"></span>
      <a class="btn dir-btn" data-link="maps" data-ui="directions"></a>
    </div>
    <div class="map reveal" data-show="map"></div>
  </section>

  <section class="wrap faq" id="faq">
    <div class="faq-grid">
      <h2 class="reveal" data-ui="faq" style="font-size:clamp(38px,9vw,72px);line-height:1;margin-bottom:14px"></h2>
      <div class="reveal">
        <details open data-if="checkin"><summary data-ui="checkin_q"></summary><p data-show="checkin_a"></p></details>
        <template data-each="faq"><details><summary data-t="item.q"></summary><p data-t="item.a"></p></details></template>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="f-cta reveal">
      <h2 data-ui="foot_cta"></h2>
      <div class="acts">
        <button class="btn light" type="button" data-open-booking><span data-ui="book_now"></span></button>
        <a class="btn line" data-link="tel"><span data-ui="call"></span></a>
      </div>
    </div>
    <div class="f-grid">
      <div class="f-brand"><span class="wm" data-if="brandWord,!logo" dir="ltr"><span class="wm-t"><b data-t="brandWord"></b><small data-t="brandSub"></small></span><img class="mark" data-src="logoMark" alt=""></span><b data-if="!brandWord" data-t="name"></b><i data-if="!brandWord" data-t="nameLatin" dir="ltr"></i><p data-t="heroLine"></p></div>
      <div class="f-col">
        <h3 data-ui="foot_contact"></h3>
        <a data-link="tel"><span data-ui="reception"></span>: <span data-show="phone" dir="ltr"></span></a>
        <a data-link="wa" data-ui="whatsapp"></a>
        <a data-link="ig"><span data-ui="instagram"></span>: <span data-show="ig" dir="ltr"></span></a>
      </div>
      <div class="f-col">
        <h3 data-ui="foot_address"></h3>
        <span class="muted" data-t="address"></span>
        <a data-link="maps" data-ui="directions"></a>
      </div>
      <div class="f-col">
        <h3 data-ui="foot_stay"></h3>
        <span class="muted" data-ui="reception_always"></span>
        <span class="muted" data-if="checkin" data-show="checkin_a"></span>
        <a href="#rooms" data-ui="rooms"></a>
        <a href="#faq" data-ui="faq"></a>
      </div>
    </div>
    <div class="f-bottom">
      <span>© <span data-show="year"></span> <span data-t="name"></span> · <span data-ui="rights"></span></span>
      <button class="ghost" type="button" data-action="lang" data-ui="lang_switch"></button>
      <a class="credit" data-link="naskon" data-ui="made_by"></a>
    </div>
  </div>
</footer>

<div class="sticky">
  <span class="lbl"><b data-ui="check_avail"></b><small data-if="breakfastIncluded" data-ui="breakfast_included"></small></span>
  <button class="btn" type="button" data-open-booking>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6z"/></svg>
    <span data-ui="book_now"></span>
  </button>
</div>

<dialog id="booking" aria-labelledby="bk-title">
  <form class="sheet" data-booking>
    <span class="grab" aria-hidden="true"></span>
    <div class="sheet-head"><h2 id="bk-title" data-ui="book_now"></h2><button class="close" type="button" data-close-booking data-aria="close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="two">
      <label class="field"><span data-ui="checkin"></span><input type="date" name="in" required></label>
      <label class="field"><span data-ui="checkout"></span><input type="date" name="out" required></label>
    </div>
    <label class="field"><span data-ui="room"></span><select name="room"></select></label>
    <div class="stepper"><span data-ui="guests"></span><div><button type="button" data-step="-1" aria-label="−">−</button><b data-guest-count></b><button type="button" data-step="1" aria-label="+">+</button></div></div>
    <p class="note"><span data-nights></span></p>
    <button class="btn" type="submit"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6z"/></svg><span data-ui="send_wa"></span></button>
    <p class="note" data-ui="wa_note"></p>
  </form>
</dialog>

<dialog id="menu" aria-label="Menu">
  <div class="panel">
    <div class="m-top">
      <span class="m-brand"><span class="wm" data-if="brandWord,!logo" dir="ltr"><span class="wm-t"><b data-t="brandWord"></b><small data-t="brandSub"></small></span><img class="mark" data-src="logoMark" alt=""></span><b data-if="!brandWord" data-t="name"></b><i data-if="!brandWord" data-t="nameLatin" dir="ltr"></i></span>
      <button class="close" type="button" data-close-menu data-aria="close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <nav class="m-links">
      <a href="#rooms" data-ui="rooms"></a>
      <a href="#inside" data-ui="inside" data-if="spaces"></a>
      <a href="#reviews" data-ui="reviews" data-if="reviews"></a>
      <a href="#location" data-ui="location"></a>
      <a href="#faq" data-ui="faq"></a>
    </nav>
    <div class="m-foot">
      <button class="btn light" type="button" data-open-booking data-close-menu><span data-ui="menu_book"></span></button>
      <div class="m-row">
        <a data-link="tel"><small data-ui="call"></small><span data-show="phone" dir="ltr"></span></a>
        <button class="ghost" type="button" data-action="lang" data-ui="lang_switch"></button>
      </div>
      <span class="m-addr" data-t="address"></span>
    </div>
  </div>
</dialog>

<script src="shared/engine.js?v=20261022-2"></script>
<script>
  /* Desktop shows a "Book now" button in the header. */
  (function(){var b=document.querySelector('.top-actions .btn');if(b&&matchMedia('(min-width:960px)').matches)b.hidden=false;})();
  NaskonHotel.boot();
  /* Header follows the page: sits under the demo ribbon at first, then turns solid. */
  (function(){
    var root=document.documentElement, top=document.querySelector('.hero>.top'), ticking=false;
    function update(){
      ticking=false;
      var pill=document.querySelector('.demo-pill'), off=0;
      if(pill&&!pill.hidden){off=Math.max(0,pill.getBoundingClientRect().bottom);}
      top.style.top=off+'px';
      root.classList.toggle('scrolled',window.scrollY>40);
    }
    function ask(){if(!ticking){ticking=true;requestAnimationFrame(update);}}
    addEventListener('scroll',ask,{passive:true});addEventListener('resize',ask);
    addEventListener('load',update);setTimeout(update,300);update();
  })();
</script>
</body>
</html>
