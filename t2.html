<!doctype html>
<html lang="ar" dir="rtl" data-accent="accent2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فندق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Template 2 · Dynamic. Mobile first; the layout widens at 960px. */
:root{
  --bg:#F4F2EC; --surface:#FFFFFF; --ink:#151A14; --muted:#5F655B; --line:#E1DED4; --olive:#2E3A27;
  --accent:#C08A4A; --accent-ink:#151A14; --label:#8A5A22;
  --display:"Readex Pro",system-ui,sans-serif; --body:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:clip}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{width:100%;max-width:1440px;margin-inline:auto;padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px))}
.label{font-size:12.5px;font-weight:700;letter-spacing:1.5px;color:var(--label)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border:0;background:var(--ink);color:var(--bg);font-weight:700;text-decoration:none}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.icon{width:20px;height:20px;flex:none}
h2.big{font-size:clamp(34px,9vw,76px);line-height:1}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;height:64px;padding-top:env(safe-area-inset-top,0px)}
.brand{font-family:var(--display);font-weight:700;font-size:22px;text-decoration:none;letter-spacing:-.02em;display:flex;align-items:center}
.brand img{height:40px;width:auto}
.dot{color:var(--accent)}
.top nav{display:none}
.top-actions{display:flex;align-items:center;gap:4px}
.demo{font-size:11px;color:var(--muted)}
.ghost{height:44px;min-width:44px;padding:0 6px;border:0;background:transparent;color:inherit;display:inline-flex;align-items:center;justify-content:center;font-weight:500}

/* Hero */
.hero h1{font-size:clamp(50px,13.5vw,132px);line-height:1;letter-spacing:-.045em;white-space:pre-line;margin-top:10px}
.hero-text{display:grid;gap:10px;padding-top:10px}
.hero-text p{margin:0;color:#3E443B;max-width:440px}
.collage{position:relative;margin-top:26px;height:470px}
.collage .main{position:absolute;inset-inline-end:0;top:0;width:85%;height:400px;object-fit:cover}
.collage .small{position:absolute;inset-inline-start:20px;bottom:0;width:52%;height:220px;object-fit:cover;border:6px solid var(--bg)}
.score{position:absolute;inset-inline-start:20px;top:24px;padding:10px 14px;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;line-height:1.2}
.score b{font-family:var(--display);font-size:24px}
.score span{font-size:11px;opacity:.8}

/* Booking strip */
.strip{margin-top:26px;background:var(--ink);color:var(--bg)}
.mstrip{display:flex;align-items:center;justify-content:space-between;gap:14px;border:0;background:transparent;color:var(--bg);padding-block:14px;text-align:start}
.mstrip>span:first-child{display:flex;flex-direction:column;line-height:1.35}
.mstrip small{font-size:11px;opacity:.72}
.mstrip b{font-size:16px}
.strip form{display:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding-block:16px}
.strip label{display:flex;flex-direction:column;gap:3px;font-size:11px;opacity:.95;min-width:0}
.strip label span{opacity:.72}
.strip input,.strip select{border:0;background:transparent;padding:0;font:700 15px var(--body);color:var(--bg);width:100%;color-scheme:dark}
.strip select option{color:#151A14}
.strip label+label{padding-inline-start:14px;border-inline-start:1px solid rgba(244,242,236,.2)}
.strip .x{display:none}
.strip .g{display:flex;align-items:center;gap:10px}
.strip .g button{width:30px;height:30px;border:1px solid rgba(244,242,236,.4);background:transparent;color:var(--bg)}

/* Marquee */
.marquee{background:var(--olive);color:#E9E6DC;overflow:hidden;height:56px;display:flex;align-items:center}
.marquee .run{display:flex;gap:22px;white-space:nowrap;animation:run 40s linear infinite;padding-inline-start:22px;font-weight:500}
.marquee .run span::after{content:"✦";color:var(--accent);margin-inline-start:22px}
@keyframes run{to{transform:translateX(50%)}}
[dir=ltr] .marquee .run{animation-name:run-ltr}
@keyframes run-ltr{to{transform:translateX(-50%)}}

/* Rooms */
.rooms{padding-top:64px}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
.arrows{display:flex;gap:8px}
.arrows button{width:44px;height:44px;border:1px solid var(--ink);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.arrows button+button{background:var(--ink);color:var(--bg)}
[dir=ltr] .arrows svg{transform:scaleX(-1)}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:max(20px,env(safe-area-inset-left,0px));scroll-padding-inline:20px}
.track::-webkit-scrollbar{display:none}
.room{flex:none;width:min(76vw,300px);scroll-snap-align:start;display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.room img{width:100%;aspect-ratio:6/7;object-fit:cover}
.room .card{position:relative;margin:-56px 0 0;margin-inline-end:30px;padding:16px 18px;background:var(--surface);display:grid;gap:4px}
.room h3{font-size:20px}
.room small{font-size:13px;color:var(--muted)}
.room .cta{font-size:13.5px;font-weight:700;margin-top:4px}

/* Spaces, zigzag */
.inside{padding-top:72px}
.space{position:relative;margin-bottom:40px}
.space img{width:100%;height:290px;object-fit:cover}
.space .card{position:relative;margin-top:-48px;margin-inline:60px 20px;padding:20px;background:var(--surface);display:grid;gap:8px}
.space:nth-of-type(even) img{width:78%;margin-inline-start:auto;height:250px}
.space:nth-of-type(even) .card{margin-inline:20px 60px}
.space h3{font-size:22px}
.space p{margin:0;font-size:14.5px;color:#3E443B}

/* Numbers */
.numbers{margin-top:32px;background:var(--olive);color:var(--bg)}
.numbers .wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 20px;padding-block:40px}
.numbers b{display:block;font-family:var(--display);font-size:44px;line-height:1;letter-spacing:-.03em}
.numbers span{font-size:13px;opacity:.82}

/* Reviews */
.reviews{padding-top:64px}
.reviews .track blockquote{flex:none;width:min(74vw,320px);scroll-snap-align:start;margin:0;padding:20px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.reviews .stars{color:var(--label);letter-spacing:2px;font-size:14px}
.reviews p{margin:0;font-size:15px;line-height:1.7}
.reviews cite{font-style:normal;font-size:12.5px;color:var(--muted)}

/* Location */
.location{padding-top:64px;display:grid;gap:14px}
.map{height:190px;background:#E4E2DA;background-image:linear-gradient(#D6D3C9 1px,transparent 1px),linear-gradient(90deg,#D6D3C9 1px,transparent 1px);background-size:24px 24px;position:relative}
.map::after{content:"";position:absolute;inset-inline-start:50%;top:50%;width:34px;height:34px;margin:-17px;background:var(--ink);box-shadow:inset 0 0 0 12px var(--ink),inset 0 0 0 20px var(--accent)}
.dist div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.dist span:last-child{color:var(--muted)}

/* FAQ */
.faq{padding-top:64px}
.faq details{padding:16px 0;border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font-family:var(--display);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq p{margin:8px 0 0;color:#3E443B;font-size:15px}

/* Footer */
footer{margin-top:64px;background:var(--ink);color:var(--bg);padding-block:36px calc(116px + env(safe-area-inset-bottom,0px))}
footer .name{font-family:var(--display);font-weight:700;font-size:clamp(64px,18vw,160px);letter-spacing:-.05em;line-height:.9}
.contact{display:grid;gap:10px;margin-top:20px;font-size:15px}
.contact a{color:var(--bg);text-decoration:none}
.credit{display:block;margin-top:24px;padding-top:16px;border-top:1px solid rgba(244,242,236,.15);font-size:12px;color:#9EA49A;text-decoration:none}

/* Sticky bar */
.sticky{position:fixed;inset-inline:0;bottom:0;z-index:20;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.sticky b{font-family:var(--display)}

/* Sheet & menu */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:rgba(21,26,20,.55)}
.sheet{position:absolute;inset-inline:0;bottom:0;background:var(--bg);padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-width:560px;margin-inline:auto;max-height:92svh;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-size:26px}
.close{width:44px;height:44px;border:1px solid var(--ink);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.field input,.field select{border:0;background:transparent;padding:2px 0;font:700 16px var(--body);color:var(--ink);width:100%;min-height:28px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;background:var(--surface);border:1px solid var(--line)}
.stepper div{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border:1px solid var(--line);background:transparent;font-size:20px;color:var(--ink)}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
#menu .panel{position:absolute;inset:0;background:var(--ink);color:var(--bg);padding:calc(20px + env(safe-area-inset-top,0px)) 24px;display:flex;flex-direction:column;gap:6px}
#menu .panel a{color:var(--bg);text-decoration:none;font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.03em}
#menu .close{align-self:flex-end;color:var(--bg);border-color:rgba(244,242,236,.4)}

/* Reveal */
.js-reveal .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.js-reveal .reveal.in{opacity:1;transform:none}
.js-reveal .slide{opacity:0;transform:translateX(-40px);transition:opacity .8s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
[dir=ltr].js-reveal .slide,[dir=ltr] .js-reveal .slide{transform:translateX(40px)}
.js-reveal .slide.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.marquee .run{animation:none}.js-reveal .reveal,.js-reveal .slide{opacity:1;transform:none;transition:none}}

/* Laptop and up */
@media (min-width:960px){
  .wrap{padding-inline:80px}
  .top{height:92px}
  .brand{font-size:30px}
  .top nav{display:flex;gap:40px;font-weight:500}
  .top nav a{text-decoration:none}
  .top [data-action=menu]{display:none}
  .top .btn{height:50px}
  .hero{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;position:relative;margin-top:20px;min-height:720px}
  .hero-text{grid-column:1 / span 7;grid-row:1;position:relative;z-index:2;align-self:start;padding-top:40px}
  .hero h1{font-size:132px}
  .hero-text p{font-size:19px;max-width:420px}
  .collage{grid-column:6 / span 7;grid-row:1;margin:0;height:720px}
  .collage .main{width:100%;height:640px;inset-inline-end:-80px;width:calc(100% + 80px)}
  .collage .small{width:300px;height:340px;inset-inline-start:-120px;border-width:10px}
  .score{inset-inline-start:auto;inset-inline-end:40px;top:40px;padding:16px 20px}
  .score b{font-size:34px}
  .strip{margin:30px auto 0;max-width:1280px;width:calc(100% - 160px)}
  .mstrip{display:none}
  .strip form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 220px;gap:32px;padding:22px 32px}
  .strip .x{display:flex}
  .strip input,.strip select{font-size:17px}
  .strip .btn{height:60px;font-size:17px}
  .marquee{margin-top:70px;height:70px;font-size:19px}
  .rooms{padding-top:110px}
  .track{padding-inline:80px;gap:28px}
  .room{width:400px}
  .room img{aspect-ratio:5/6}
  .room .card{margin-top:-70px;margin-inline-end:50px;padding:22px 24px}
  .room h3{font-size:24px}
  .inside{padding-top:120px}
  .space{height:560px;margin-bottom:70px}
  .space img,.space:nth-of-type(even) img{position:absolute;top:0;inset-inline-start:auto;inset-inline-end:0;width:60%;height:100%}
  .space:nth-of-type(even) img{inset-inline-end:auto;inset-inline-start:0}
  .space .card,.space:nth-of-type(even) .card{position:absolute;top:140px;inset-inline-start:80px;width:520px;margin:0;padding:44px}
  .space:nth-of-type(even) .card{inset-inline-start:auto;inset-inline-end:80px}
  .space h3{font-size:40px}
  .space p{font-size:18px}
  .numbers{margin-top:50px}
  .numbers .wrap{grid-template-columns:repeat(4,minmax(0,1fr));padding-block:70px}
  .numbers b{font-size:72px}
  .numbers span{font-size:15px}
  .reviews{padding-top:110px}
  .reviews .track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;gap:24px}
  .reviews .track blockquote{width:auto;padding:30px}
  .reviews p{font-size:18px}
  .location{padding-top:110px;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:center}
  .location .info{grid-column:span 5;display:grid;gap:18px}
  .location .map{grid-column:7 / span 6;height:420px}
  .faq{padding-top:110px}
  .faq .grid{display:grid;grid-template-columns:5fr 6fr;column-gap:8%}
  footer{margin-top:120px;padding-block:70px 50px}
  footer .row{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
  .contact{margin-top:0}
  .sticky{display:none}
}
</style>
</head>
<body>

<header class="wrap top" id="top">
  <a class="brand" href="#top"><img data-src="logo" data-alt="name" alt=""><span data-if="!logo"><span data-t="name"></span><span class="dot">.</span></span></a>
  <nav aria-label="الأقسام">
    <a href="#rooms" data-ui="rooms"></a>
    <a href="#inside" data-ui="inside" data-if="spaces"></a>
    <a href="#reviews" data-ui="reviews" data-if="reviews"></a>
    <a href="#location" data-ui="location"></a>
  </nav>
  <div class="top-actions">
    <span class="demo" data-if="demo" data-ui="demo"></span>
    <button class="ghost" type="button" data-action="lang" data-ui="lang_switch"></button>
    <button class="ghost" type="button" data-action="menu" data-aria="menu"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 8h16M4 16h10"/></svg></button>
  </div>
</header>

<section class="wrap hero">
  <div class="hero-text">
    <span class="label" data-t="eyebrow"></span>
    <h1 data-show="hero" data-default="hero_t2"></h1>
    <p data-t="heroLine"></p>
  </div>
  <div class="collage slide">
    <img class="main" data-src="photos.hero" alt="" fetchpriority="high">
    <img class="small" data-src="photos.heroSmall" alt="" loading="lazy">
    <div class="score" data-if="rating"><b data-show="rating"></b><span data-ui="on_google"></span></div>
  </div>
</section>

<div class="strip" id="bar">
  <button class="wrap mstrip" type="button" data-open-booking>
    <span><small data-ui="dates"></small><b data-ui="check_avail"></b></span>
    <span class="btn btn-accent" data-ui="book"></span>
  </button>
  <form class="wrap" data-booking>
    <label><span data-ui="checkin"></span><input type="date" name="in" required></label>
    <label><span data-ui="checkout"></span><input type="date" name="out" required></label>
    <label class="x"><span data-ui="guests"></span><span class="g"><button type="button" data-step="-1" aria-label="−">−</button><b data-guest-count></b><button type="button" data-step="1" aria-label="+">+</button></span></label>
    <label class="x"><span data-ui="room"></span><select name="room"></select></label>
    <button class="btn btn-accent" type="submit" data-ui="book"></button>
  </form>
</div>

<div class="marquee" aria-label="" data-if="amenities">
  <div class="run">
    <template data-each="amenities"><span data-t="item"></span></template>
    <template data-each="amenities"><span data-t="item" aria-hidden="true"></span></template>
  </div>
</div>

<main>
  <section class="rooms" id="rooms" data-carousel data-if="rooms">
    <div class="wrap head reveal">
      <h2 class="big" data-ui="rooms"></h2>
      <div class="arrows">
        <button type="button" data-dir="prev" data-aria="prev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        <button type="button" data-dir="next" data-aria="next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      </div>
    </div>
    <div class="track" data-track>
      <template data-each="rooms">
        <a class="room reveal" href="#bar" data-pick-room>
          <img data-src="item.photo" data-alt="item.name" alt="" loading="lazy">
          <span class="card"><h3 data-t="item.name"></h3><small><span data-guests></span> · <span data-price></span></small><span class="cta" data-ui="book_room"></span></span>
        </a>
      </template>
    </div>
  </section>

  <section class="inside" id="inside" data-if="spaces">
    <div class="wrap head reveal"><h2 class="big" data-ui="inside"></h2></div>
    <template data-each="spaces" data-limit="2">
      <article class="space">
        <img class="slide" data-src="item.photo" data-alt="item.name" alt="" loading="lazy">
        <div class="card reveal"><h3 data-t="item.name"></h3><p data-t="item.text"></p></div>
      </article>
    </template>
  </section>

  <section class="numbers">
    <div class="wrap">
      <div class="reveal" data-if="rating"><b data-show="rating"></b><span data-ui="rating_google"></span></div>
      <div class="reveal" data-if="roomsTotal"><b data-show="rooms_total"></b><span data-ui="rooms_label"></span></div>
      <div class="reveal"><b>24</b><span data-ui="reception_24"></span></div>
      <div class="reveal" data-if="minutesToCentre"><b data-t="minutesToCentre"></b><span data-ui="to_centre"></span></div>
    </div>
  </section>

  <section class="reviews" id="reviews" data-if="reviews">
    <div class="wrap head reveal"><h2 class="big" data-ui="said"></h2></div>
    <div class="track">
      <template data-each="reviews" data-limit="3">
        <blockquote class="reveal"><span class="stars" aria-hidden="true">★★★★★</span><p data-t="item.text"></p><cite data-t="item.author"></cite></blockquote>
      </template>
    </div>
  </section>

  <section class="wrap location" id="location">
    <div class="info reveal">
      <h2 class="big" data-ui="location"></h2>
      <span data-t="address"></span>
      <div class="dist"><template data-each="distances"><div><span data-t="item.place"></span><span data-t="item.time"></span></div></template></div>
      <a class="btn" data-link="maps" data-ui="directions"></a>
    </div>
    <div class="map reveal" aria-hidden="true"></div>
  </section>

  <section class="wrap faq" id="faq">
    <div class="grid">
      <h2 class="big reveal" data-ui="faq" style="margin-bottom:16px"></h2>
      <div class="reveal">
        <details open data-if="checkin"><summary data-ui="checkin_q"></summary><p data-show="checkin_a"></p></details>
        <template data-each="faq"><details><summary data-t="item.q"></summary><p data-t="item.a"></p></details></template>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="row">
      <div class="name"><span data-t="name"></span><span class="dot">.</span></div>
      <div class="contact">
        <a data-link="tel"><span data-ui="reception"></span>: <span data-show="phone" dir="ltr"></span></a>
        <a data-link="wa" data-ui="whatsapp"></a>
        <a data-link="ig"><span data-ui="instagram"></span>: <span data-show="ig" dir="ltr"></span></a>
      </div>
    </div>
    <a class="credit" data-link="naskon" data-ui="made_by"></a>
  </div>
</footer>

<div class="sticky">
  <b data-ui="check_avail"></b>
  <button class="btn" type="button" data-open-booking data-ui="book_now"></button>
</div>

<dialog id="booking" aria-labelledby="bk-title">
  <form class="sheet" data-booking>
    <div class="sheet-head"><h2 id="bk-title" data-ui="book_now"></h2><button class="close" type="button" data-close-booking data-aria="close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="two">
      <label class="field"><span data-ui="checkin"></span><input type="date" name="in" required></label>
      <label class="field"><span data-ui="checkout"></span><input type="date" name="out" required></label>
    </div>
    <label class="field"><span data-ui="room"></span><select name="room"></select></label>
    <div class="stepper"><span data-ui="guests"></span><div><button type="button" data-step="-1" aria-label="−">−</button><b data-guest-count></b><button type="button" data-step="1" aria-label="+">+</button></div></div>
    <p class="note" data-nights></p>
    <button class="btn" type="submit"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6z"/></svg><span data-ui="send_wa"></span></button>
    <p class="note" data-ui="wa_note"></p>
  </form>
</dialog>

<dialog id="menu" aria-label="Menu">
  <div class="panel">
    <button class="close" type="button" data-close-menu data-aria="close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <a href="#rooms" data-ui="rooms"></a>
    <a href="#inside" data-ui="inside"></a>
    <a href="#reviews" data-ui="reviews"></a>
    <a href="#location" data-ui="location"></a>
    <a href="#faq" data-ui="faq"></a>
  </div>
</dialog>

<script src="shared/engine.js?v=20261022-5"></script>
<script>NaskonHotel.boot();</script>
</body>
</html>
