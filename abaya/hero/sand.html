<style>
:root{--wine:#4C050D;--wine2:#2A0309;--navy:#112250;--navy2:#0A1433;--ivory:#EFE8DD;--ivory2:#F7F3EC;--champ:#D8C5A3;--ink:#24191A;
--ar:'Amiri',serif;--arb:'IBM Plex Sans Arabic',system-ui,sans-serif;--en:'Cormorant Garamond',serif;--enb:'Jost',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--arb);-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
.top{position:fixed;inset:0 0 auto;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;color:var(--fg,var(--ivory));opacity:0;transition:opacity 1s}
.top.on{opacity:1}
.top .lg{position:absolute;left:50%;transform:translateX(-50%);width:70px;height:43px}
.top .lg svg{width:100%;height:100%}
.ib{width:42px;height:42px;display:grid;place-items:center;border:0;background:none;color:inherit}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 28px;border-radius:60px;font:500 14px var(--arb);letter-spacing:.02em;cursor:pointer;border:0;min-height:48px}
.btn.l{background:var(--ivory2);color:var(--wine)}
.btn.o{border:1px solid currentColor;background:none;color:inherit}
.kick{font:400 11px var(--enb);letter-spacing:.34em;text-transform:uppercase}
.lab{position:fixed;z-index:40;bottom:calc(14px + env(safe-area-inset-bottom));inset-inline-start:14px;display:flex;gap:6px}
.lab a,.lab button{font:500 11px var(--enb);letter-spacing:.08em;padding:8px 12px;border-radius:30px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
:root{--sand0:#EDE3D5;--sand:#CDBBA6;--sand2:#B9A58E;--esp:#3a2618;--esp2:#24170e;--gold:#B98A3C;--gold2:#E6C27A;--paper:#F3ECE2}
body{background:var(--sand);color:var(--esp)}
html[lang=en] body{font-family:var(--enb)}
/* background layers */
.bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(ellipse 85% 62% at 50% 33%,#F1E8DB 0%,#DCCCB8 38%,#C7B39C 70%,#A8937D 100%)}
.light{position:fixed;width:140vmin;height:140vmin;z-index:-2;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,247,230,.55),rgba(255,247,230,0) 58%);animation:lt 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes lt{to{transform:translate(-50%,-50%) scale(1.1);opacity:.75}}
.linen{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.14;mix-blend-mode:multiply;

.vig{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 120% 90% at 50% 40%,transparent 55%,rgba(90,62,38,.22) 100%)}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
/* header */
.top{color:var(--esp);opacity:1;transition:background .5s,box-shadow .5s}
.top.solid{background:rgba(237,227,213,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(58,38,24,.08)}
.top .lg{opacity:0;transition:opacity .5s;color:var(--esp)}
.top.solid .lg{opacity:1}
.tr{display:flex;align-items:center;gap:2px}
.lgb{font:500 12px var(--enb);letter-spacing:.12em;border:1px solid rgba(58,38,24,.3);border-radius:40px;padding:7px 12px;background:none;color:var(--esp);cursor:pointer}
/* hero */
.hero{position:relative;z-index:1;height:100svh;min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(64px + env(safe-area-inset-top)) 22px calc(70px + env(safe-area-inset-bottom));text-align:center}
.hin{display:flex;flex-direction:column;align-items:center;will-change:transform,opacity}
.em{flex:none}
.wm{width:min(66vw,370px);margin-top:clamp(6px,1.6vh,16px);color:var(--esp)}
.wm svg{display:block;width:100%;height:auto;aspect-ratio:674/214}
.tg{font:400 clamp(17px,4.7vw,26px)/1.75 var(--ar);color:rgba(58,38,24,.8);margin-top:clamp(10px,2vh,20px)}
html[lang=en] .tg{font:italic 400 clamp(19px,5vw,28px)/1.4 var(--en)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:clamp(16px,3vh,28px)}
.btn.p{background:var(--esp);color:#F3E7D3;box-shadow:0 14px 30px -16px rgba(36,23,14,.7)}
.btn.s{border:1px solid rgba(58,38,24,.35);color:var(--esp);background:rgba(243,236,226,.25)}
.btn{transition:transform .3s,box-shadow .3s}
.btn:active{transform:scale(.97)}
html[lang=en] .btn{font:500 13px var(--enb);padding:14px 20px;letter-spacing:.04em}
.r{opacity:0;transform:translateY(14px);filter:blur(8px);transition:opacity 1.2s,transform 1.2s cubic-bezier(.2,.7,.2,1),filter 1.2s}
.on .r{opacity:1;transform:none;filter:none}
.on .r.d1{transition-delay:.25s}.on .r.d2{transition-delay:.5s}
.cue{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font:400 10px var(--enb);letter-spacing:.3em;color:rgba(58,38,24,.6);opacity:0;transition:opacity 1s 1.2s}
.on .cue{opacity:1}
.cue i{width:1px;height:34px;background:linear-gradient(rgba(58,38,24,.6),transparent);animation:dr 2.2s ease-in-out infinite;transform-origin:top}
@keyframes dr{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
/* collection teaser */
.col{position:relative;z-index:1;background:linear-gradient(to bottom,rgba(237,227,213,0),var(--paper) 18%);padding:110px 0 70px}
.sh{text-align:center;padding:0 22px 30px}
.kick{color:var(--gold);font-weight:500}
.sh h2{font:400 clamp(34px,9vw,58px)/1.3 var(--ar);margin-top:8px;color:var(--esp)}
html[lang=en] .sh h2{font-family:var(--en)}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 22px 26px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.cd{flex:0 0 min(62vw,300px);scroll-snap-align:center;text-align:center}
.cd .ph{aspect-ratio:3/4.2;border-radius:999px 999px 8px 8px;overflow:hidden;background:var(--sand2);position:relative;box-shadow:0 30px 50px -34px rgba(58,38,24,.6)}
.cd .ph::after{content:"";position:absolute;inset:8px;border:1px solid rgba(230,194,122,.7);border-radius:999px 999px 4px 4px}
.cd img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;transform:scale(1.12);transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.cd.in img{transform:scale(1)}
.cd b{display:block;font:400 22px var(--ar);margin-top:14px;color:var(--esp)}
html[lang=en] .cd b{font-family:var(--en);font-size:24px}
.cd span{font-size:12.5px;color:rgba(58,38,24,.65)}
.foot{position:relative;z-index:1;background:var(--esp2);color:#E9D9BC;text-align:center;padding:56px 22px calc(80px + env(safe-area-inset-bottom))}
.foot svg{width:min(52vw,220px);height:auto;aspect-ratio:670/412;color:var(--gold2)}
.foot p{font-size:12px;opacity:.55;margin-top:18px;letter-spacing:.06em}
.lab{opacity:.85}
@media (prefers-reduced-motion:reduce){.light{animation:none}}
</style>
