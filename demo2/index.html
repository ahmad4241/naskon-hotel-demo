<style>
:root{--pd:#3A2850;--pm:#55406F;--ink:#241C2E;--soft:#5B5266;--gold:#C6A15B;--gl:#E4CB93;--cream:#FAF6EF;--ca:#F1E9DA;--line:#241C2E1a;--f:"Cairo","Vazirmatn",system-ui,sans-serif;--h:"Reem Kufi","Vazirmatn","Cairo",sans-serif;--e:"Cormorant Garamond",Georgia,serif;--ease:cubic-bezier(.22,.8,.2,1)}
[lang="fa"]{--f:"Vazirmatn","Cairo",system-ui,sans-serif;--h:"Vazirmatn","Reem Kufi",sans-serif}
[lang="en"]{--h:"Cormorant Garamond",Georgia,serif}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:hidden;scroll-behavior:smooth;scroll-padding-top:74px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.8 var(--f);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px}
.k{display:block;font:italic 500 18px var(--e);letter-spacing:.14em;color:var(--gold)}
[lang="en"] .k{font-size:16px;letter-spacing:.22em;text-transform:none}
.t{margin:4px 0 12px;font:700 clamp(28px,5vw,42px)/1.25 var(--h);color:var(--pd)}
[lang="en"] .t{font-weight:600;letter-spacing:.01em}
.lede{margin:0;color:var(--soft);font-size:17px;max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 26px;border-radius:999px;font-weight:600;font-size:15px;border:1.5px solid var(--gold);cursor:pointer;transition:background .3s,color .3s,transform .2s}
.btn:active{transform:scale(.97)}
.btn-g{background:var(--gold);color:var(--ink)}
.btn-l{background:transparent;color:var(--cream);border-color:#E4CB9399}
/* header */
.hd{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .4s,box-shadow .4s}
.hd.s{background:#241C2Ef0;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 30px -20px #000}
.hdi{display:flex;align-items:center;gap:12px;height:66px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;color:var(--cream)}
.brand img{width:40px;height:40px;border-radius:50%}
.brand b{display:block;font:600 16px/1.2 var(--h)}
.brand i{display:block;font:italic 500 12px var(--e);letter-spacing:.16em;color:var(--gl)}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid #E4CB9355;background:#ffffff12;color:var(--gl);display:grid;place-items:center;cursor:pointer}
.hbk{min-height:42px;padding:0 18px;font-size:14px}
.lw{position:relative}
.lm{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:160px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 24px 50px -20px #241C2E88;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .25s,transform .3s var(--ease)}
.lm.o{opacity:1;transform:none;pointer-events:auto}
.lm button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;min-height:44px;font-weight:500;color:var(--ink);cursor:pointer}
.lm button.on{background:var(--ca)}
.lm button .ic{width:16px;height:16px;color:var(--gold);opacity:0}.lm button.on .ic{opacity:1}
.nav{display:none}
@media (min-width:980px){.nav{display:flex;gap:26px;margin-inline-end:18px}.nav a{color:#FAF6EFcc;font-size:14.5px;font-weight:500}.nav a:hover{color:var(--gl)}}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:var(--cream);overflow:hidden;background:var(--ink)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;transform:scale(1.06);animation:hz 9s var(--ease) forwards}
@keyframes hz{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#241C2Ecc 0%,#241C2E33 26%,#241C2E26 45%,#241C2Ee6 78%,#241C2E 100%)}
.hin{position:relative;z-index:1;width:100%;padding-bottom:150px;text-align:center}
.hin .k{color:var(--gl)}
.hin h1{margin:6px 0 0;font:700 clamp(40px,9vw,76px)/1.12 var(--h);letter-spacing:.01em}
.hin .en{margin-top:4px;font:italic 500 clamp(16px,2.6vw,22px) var(--e);letter-spacing:.34em;color:var(--gl)}
.stars{display:flex;justify-content:center;gap:6px;margin:14px 0 0;color:var(--gold)}
.stars .ic{width:14px;height:14px;fill:currentColor;stroke:none}
.hin p{margin:14px auto 0;max-width:46ch;color:#FAF6EFd9;font-size:16.5px}
.hct{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
/* booking card */
.book{position:relative;z-index:5;margin:-110px auto 0;max-width:980px;padding:0 16px}
.bc{background:#fff;border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:0 40px 70px -40px #241C2E99}
.bc h3{margin:0 0 12px;font:700 18px var(--h);color:var(--pd);display:flex;align-items:center;gap:8px}
.bc h3 .ic{color:var(--gold)}
.bg{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fld{min-width:0}.fld input,.fld select{min-width:0;max-width:100%}
.fld{display:flex;flex-direction:column;gap:4px;background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:9px 13px}
.fld span{font-size:12px;color:var(--soft)}
.fld input,.fld select{border:0;background:none;font-size:15px;font-weight:600;color:var(--ink);outline:0;width:100%;min-height:26px}
.fld.w{grid-column:1/-1}
.bgo{grid-column:1/-1;width:100%;min-height:54px;font-size:16px}
.bnote{margin:10px 0 0;font-size:12.5px;color:var(--soft);text-align:center}
@media (min-width:860px){.bg{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,1fr) auto;align-items:stretch}.fld.w{grid-column:auto}.bgo{grid-column:auto;width:auto;min-height:auto;padding:0 30px}}
/* sections */
section.sec{padding:84px 0 0}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:26px}
@media (min-width:860px){.facts{grid-template-columns:repeat(4,1fr)}}
.fact{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px}
.fact .ic{color:var(--gold);width:22px;height:22px}
.fact b{font:700 17px var(--h);color:var(--pd)}
.fact span{font-size:13px;color:var(--soft);line-height:1.5}
.about{display:grid;gap:28px}
@media (min-width:900px){.about{grid-template-columns:1.1fr .9fr;align-items:center}}
.ab-img{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;box-shadow:0 40px 60px -40px #241C2Ecc}
.ab-img img{width:100%;height:100%;object-fit:cover}
.ab-img span{position:absolute;inset:auto 14px 14px;background:#241C2Ecc;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--cream);border-radius:14px;padding:10px 14px;font-size:13px}
/* rooms */
.rooms{display:grid;gap:14px;margin-top:28px}
@media (min-width:700px){.rooms{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.rooms{grid-template-columns:repeat(3,1fr)}}
.room{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.rph{position:relative;aspect-ratio:4/3;background:radial-gradient(120% 90% at 30% 20%,#55406F,#241C2E);display:grid;place-items:center;color:#E4CB93aa}
.rph .ic{width:46px;height:46px;stroke-width:1.1}
.rph em{position:absolute;inset:auto 12px 10px auto;font:italic 500 13px var(--e);letter-spacing:.14em;color:#E4CB9399}
[dir="rtl"] .rph em{inset:auto auto 10px 12px}
.rb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.rb h3{margin:0;font:700 20px var(--h);color:var(--pd)}
.rb p{margin:0;font-size:14px;color:var(--soft);line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chips span{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--cream);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.chips .ic{width:13px;height:13px;color:var(--gold)}
.rb .btn{margin-top:auto;min-height:44px;font-size:14px;background:transparent;color:var(--pd)}
/* rooftop cafe */
.cafe{margin-top:84px;background:var(--ink);color:var(--cream);position:relative;overflow:hidden}
.cafe-in{display:grid;gap:0}
@media (min-width:900px){.cafe-in{grid-template-columns:1.1fr .9fr}}
.cafe-img{min-height:320px;background-size:cover;background-position:center}
.cafe-tx{padding:44px 24px 48px}
.cafe-tx .t{color:var(--cream)}
.cafe-tx .lede{color:#FAF6EFb3}
.cafe-tx .btn{margin-top:22px}
/* amenities */
.amen{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:26px}
@media (min-width:860px){.amen{grid-template-columns:repeat(3,1fr)}}
.am{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.am .ic{width:38px;height:38px;padding:8px;border-radius:12px;background:var(--ca);color:var(--pd);flex:none}
.am b{font-size:14.5px;font-weight:600;line-height:1.45}
/* location */
.loc{display:grid;gap:18px;margin-top:26px}
@media (min-width:900px){.loc{grid-template-columns:.9fr 1.1fr}}
.lcard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:10px}
.lrow{display:flex;gap:12px;align-items:center;padding:12px 10px}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow .ic{color:var(--gold);width:22px;height:22px}
.lrow b{display:block;font-weight:600;font-size:15px;line-height:1.4}
.lrow span{display:block;font-size:13px;color:var(--soft)}
.map{border-radius:24px;overflow:hidden;min-height:320px;background:var(--ca);border:1px solid var(--line)}
.map iframe{width:100%;height:100%;min-height:320px;border:0;display:block}
/* footer */
.ft{margin-top:84px;background:var(--ink);color:#FAF6EFcc;padding:48px 0 calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid #C6A15B55}
.fg{display:grid;gap:28px}
@media (min-width:860px){.fg{grid-template-columns:1.3fr 1fr 1fr}}
.fbr{display:flex;align-items:center;gap:12px}
.fbr img{width:52px;height:52px;border-radius:50%}
.fbr b{display:block;font:600 19px var(--h);color:var(--cream)}
.fbr i{display:block;font:italic 500 13px var(--e);letter-spacing:.18em;color:var(--gl)}
.ft h4{margin:0 0 10px;font:600 15px var(--h);color:var(--gl)}
.ft ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14.5px}
.ft li a,.ft li{display:flex;align-items:center;gap:9px}
.ft li .ic{width:17px;height:17px;color:var(--gold)}
.soc{display:flex;gap:10px;margin-top:16px}
.soc a{width:44px;height:44px;border-radius:50%;border:1px solid #C6A15B55;display:grid;place-items:center;color:var(--gl)}
.fb{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:34px;padding-top:18px;border-top:1px solid #ffffff14;font-size:12.5px;color:#FAF6EF80}
.fb a{color:var(--gl);font-weight:600}
.wa{position:fixed;z-index:40;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;width:56px;height:56px;border-radius:50%;background:#1F9D55;color:#fff;display:grid;place-items:center;box-shadow:0 16px 30px -12px #0008}
.wa .ic{width:26px;height:26px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* === pro pass === */
section.sec{padding:104px 0 0}
.k{display:flex;align-items:center;gap:10px}
.k::before{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
[dir="rtl"] .k::before{background:linear-gradient(270deg,transparent,var(--gold))}
.hin .k{justify-content:center}.hin .k::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
[dir="rtl"] .hin .k::after{background:linear-gradient(270deg,var(--gold),transparent)}
.hframe{position:absolute;inset:86px 14px 124px;border:1px solid #E4CB9340;border-radius:4px;pointer-events:none;z-index:1}
.hframe::before,.hframe::after{content:"";position:absolute;width:26px;height:26px;border:1.5px solid var(--gold)}
.hframe::before{top:-1px;inset-inline-start:-1px;border-width:1.5px 0 0 1.5px}
.hframe::after{bottom:-1px;inset-inline-end:-1px;border-width:0 1.5px 1.5px 0}
[dir="rtl"] .hframe::before{border-width:1.5px 1.5px 0 0}[dir="rtl"] .hframe::after{border-width:0 0 1.5px 1.5px}
.hlogo{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;box-shadow:0 0 0 1px #E4CB9366,0 0 0 7px #241C2E66,0 0 0 8px #E4CB9333}
.grate{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:#241C2E80;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid #E4CB9333;border-radius:99px;padding:6px 14px;font-size:13.5px;color:#FAF6EFe6}
.grate b{color:var(--gl);font-weight:700}.grate .ic{width:14px;height:14px;fill:var(--gold);stroke:none}
.cue{position:absolute;z-index:2;left:50%;bottom:132px;transform:translateX(-50%);width:26px;height:40px;border:1.5px solid #E4CB9366;border-radius:14px;display:none}
.cue::after{content:"";position:absolute;left:50%;top:8px;width:3px;height:8px;margin-left:-1.5px;border-radius:2px;background:var(--gl);animation:cue 1.8s ease infinite}
@keyframes cue{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
@media (min-width:860px){.cue{display:block}.hframe{inset:96px 36px 150px}}
/* booking refined */
.bc{border:1px solid #C6A15B40;border-radius:24px;padding:20px}
.bc h3{font-size:17px}
.fld{background:#fff;border:1px solid var(--line);border-radius:14px;transition:border-color .25s}
.fld:focus-within{border-color:var(--gold)}
.fld span{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--gold);font-size:11.5px;letter-spacing:.04em}
.fld span .ic{width:13px;height:13px}
@media (min-width:860px){.bc{padding:12px 12px 12px 20px;border-radius:999px}[dir="rtl"] .bc{padding:12px 20px 12px 12px}.bc h3,.bnote{display:none}.bg{gap:0}.fld{border:0;border-radius:0;background:none;padding:6px 18px}.fld+.fld{border-inline-start:1px solid #C6A15B40}.bgo{border-radius:999px;margin-inline-start:10px}.book{margin-top:-60px}.hin{padding-bottom:120px}}
/* reviews */
.revs{display:grid;gap:14px;margin-top:28px}
@media (min-width:900px){.revs{grid-template-columns:.8fr 1fr 1fr}}
.rscore{background:var(--ink);color:var(--cream);border-radius:24px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:4px;position:relative;overflow:hidden}
.rscore::after{content:"";position:absolute;inset:auto -30% -60% auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(#C6A15B33,transparent 70%)}
.rscore b{font:700 58px/1 var(--e);color:var(--gl)}
.rstars{display:flex;gap:4px;color:var(--gold)}.rstars .ic{width:16px;height:16px;fill:currentColor;stroke:none}
.rscore span{font-size:14px;color:#FAF6EFb3}
.rscore a{margin-top:12px;align-self:flex-start;font-size:13.5px;font-weight:600;color:var(--gl);border-bottom:1px solid #E4CB9366}
.rq{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;position:relative}
.rq::before{content:"\201D";position:absolute;top:6px;inset-inline-end:18px;font:700 64px/1 var(--e);color:#C6A15B55}
.rq p{margin:0;font:italic 500 19px/1.5 var(--e);color:var(--ink)}
.rq small{display:block;margin-top:10px;font-size:13.5px;color:var(--soft)}
.rq em{display:flex;align-items:center;gap:6px;margin-top:14px;font-style:normal;font-size:12px;color:var(--gold);font-weight:600}
.rq em .ic{width:14px;height:14px}
/* rooms refined */
.room{transition:transform .35s var(--ease),box-shadow .35s var(--ease);border-color:#C6A15B2e}
.room:hover{transform:translateY(-4px);box-shadow:0 30px 50px -34px #241C2E88}
.rph{border-bottom:1px solid #C6A15B55}
/* terrace */
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tchips span{display:inline-flex;align-items:center;gap:7px;border:1px solid #E4CB9355;border-radius:99px;padding:6px 14px;font-size:13.5px;color:var(--gl)}
.tchips .ic{width:15px;height:15px}
.tbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.tbtns .btn{margin:0}
/* footer rich */
.ft{position:relative;overflow:hidden;border-top:1px solid #C6A15B66}
.ft::before{content:"";position:absolute;inset:0 0 auto;height:200px;background:radial-gradient(55% 100% at 50% 0%,#C6A15B22,transparent);pointer-events:none}
.ft .wrap{position:relative}
.ft ul{gap:10px}

.evl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.evl div{display:flex;align-items:center;gap:10px;border:1px solid #E4CB9333;background:#ffffff08;border-radius:16px;padding:12px}
.evl .ic{width:34px;height:34px;padding:7px;border-radius:10px;background:#C6A15B22;color:var(--gl);flex:none}
.evl b{font-size:14px;font-weight:600;color:var(--cream);line-height:1.4}
.cf2{display:grid;gap:26px;align-items:center}
@media (min-width:900px){.cf2{grid-template-columns:.9fr 1.1fr}}
.cf2-img{border-radius:28px;overflow:hidden;aspect-ratio:4/3;box-shadow:0 40px 60px -40px #241C2Ecc}
.cf2-img img{width:100%;height:100%;object-fit:cover}

/* footer v2 */
.ft{margin-top:104px;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#FAF6EFcc;border-top:0!important}
.ft::before{display:none}
.fcta{background:linear-gradient(120deg,#3A2850,#241C2E);border-bottom:1px solid #C6A15B40;position:relative;overflow:hidden}
.fcta::after{content:"";position:absolute;inset:-40% auto auto -10%;width:320px;height:320px;border-radius:50%;background:radial-gradient(#C6A15B26,transparent 70%)}
.fcta-in{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-top:34px;padding-bottom:34px}
.fcta h3{margin:4px 0 0;font:700 clamp(22px,4vw,30px)/1.3 var(--h);color:var(--cream)}
.fcta .k{color:var(--gl)}
.fmain{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:48px;position:relative}
